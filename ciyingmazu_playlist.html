<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080808;
  --surface:rgba(255,255,255,0.05);
  --white:#f5f5f3;
  --white60:rgba(245,245,243,0.6);

}
html,body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--white);
  font-family:'Noto Sans TC',sans-serif;
  overflow-x:hidden;
}

/* 背景模糊封面 */
.bg-blur{
  position:fixed;inset:0;
  background:url('https://storytrace.karbonxgaiaentertainment.com/ciyingmazu_cover.jpg') center/cover no-repeat;
  filter:blur(40px) brightness(0.2) saturate(1.4);
  transform:scale(1.1);
  z-index:0;
}

.wrap{
  position:relative;z-index:1;
  min-height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:3rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
  max-width:480px;
  margin:0 auto;
}

/* 頂部品牌 */
.brand{
  font-size:8px;letter-spacing:0.45em;text-transform:uppercase;
  color:var(--white25);margin-bottom:2.5rem;text-align:center;
}

/* 封面 */
.cover-wrap{
  width:100%;
  max-width:340px;
  margin:0 auto 2rem;
  position:relative;
}
.cover-wrap img{
  width:100%;border-radius:16px;
  box-shadow:0 24px 64px rgba(0,0,0,0.6);
  display:block;
  object-fit:contain;
}
.cover-glow{
  position:absolute;inset:-20px;
  background:url('https://storytrace.karbonxgaiaentertainment.com/ciyingmazu_cover.jpg') center/cover no-repeat;
  filter:blur(30px) brightness(0.4);
  border-radius:50%;
  z-index:-1;
  opacity:0.6;
}

/* 標題 */
.song-title{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1rem;
  font-weight:300;
  letter-spacing:0.6em;
  line-height:1.8;
  text-align:center;
  margin-bottom:0.5rem;
  color:var(--white60);
}
.song-sub{
  font-size:9px;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--accent);text-align:center;margin-bottom:2.5rem;
}

/* PLAY CTA */
.play-cta{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-width:220px;
  padding:15px 38px;
  margin:0 auto 2.2rem;
  background:var(--accent);color:var(--bg);
  border-radius:100px;text-decoration:none;
  font-size:12px;font-weight:700;letter-spacing:0.35em;
  box-shadow:0 12px 36px rgba(200,169,110,0.35);
  transition:transform 0.15s,box-shadow 0.2s,opacity 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.play-cta .en{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:0.25em;line-height:1;
}
.play-cta .tri{font-size:11px;letter-spacing:0;}
.play-cta:hover,.play-cta:active{transform:translateY(-1px) scale(1.02);box-shadow:0 16px 44px rgba(200,169,110,0.5);}
.play-cta:active{transform:scale(0.98);}

/* 分隔線 */
.divider{
  width:100%;height:1px;
  background:var(--line);margin-bottom:1.5rem;
}

/* 播放清單標題 */
.playlist-label{
  width:100%;
  font-size:8px;letter-spacing:0.4em;text-transform:uppercase;
  color:var(--white25);margin-bottom:1rem;
  display:flex;align-items:center;gap:10px;
}
.playlist-label::after{
  content:'';flex:1;height:1px;background:var(--line);
}

/* 播放清單 */
.playlist{
  width:100%;
  display:flex;flex-direction:column;
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:2rem;
}

.track{
  display:flex;align-items:center;gap:1rem;
  padding:1.1rem 1.2rem;
  background:rgba(8,8,8,0.85);
  text-decoration:none;
  color:var(--white);
  transition:background 0.2s,padding-left 0.25s;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
.track:active,.track:hover{
  background:rgba(255,255,255,0.07);
  padding-left:1.6rem;
}

.track-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;letter-spacing:0.1em;
  color:var(--accent);
  min-width:24px;text-align:center;
  flex-shrink:0;
}

.track-info{flex:1;min-width:0;}
.track-title{
  font-size:13px;font-weight:500;
  letter-spacing:0.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.track-desc{
  font-size:10px;color:var(--white25);
  margin-top:3px;letter-spacing:0.05em;
}

.track-icon{
  opacity:0.3;font-size:14px;flex-shrink:0;
  transition:opacity 0.2s,transform 0.2s;
}
.track:hover .track-icon,.track:active .track-icon{
  opacity:1;transform:translate(2px,-2px);
}

/* 特別版標記 */
.badge{
  font-size:7px;letter-spacing:0.2em;text-transform:uppercase;
  background:var(--accent);color:var(--bg);
  padding:2px 7px;border-radius:100px;
  font-weight:700;flex-shrink:0;
}

/* 頁尾 */
.foot{
  font-size:7px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--white25);text-align:center;line-height:2.2;
}
.foot strong{
  font-family:'Bebas Neue',sans-serif;
  font-size:10px;letter-spacing:0.25em;
  color:var(--white60);display:block;margin-bottom:4px;
}

/* 入場動畫 */
.wrap > *{
  opacity:0;animation:fadeUp 0.6s ease forwards;
}
.brand{animation-delay:0.1s}
.cover-wrap{animation-delay:0.2s}
.song-title{animation-delay:0.3s}
.song-sub{animation-delay:0.35s}
.play-cta{animation-delay:0.38s}
.divider{animation-delay:0.4s}
.playlist-label{animation-delay:0.45s}
.playlist{animation-delay:0.5s}
.foot{animation-delay:0.65s}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<style>
.brand-section{
  background:var(--bg);
  border-top:1px solid var(--line);
  padding:5rem 1.5rem 4rem;
  max-width:480px;
  margin:0 auto;
  width:100%;
}
.brand-inner{
  display:flex;flex-direction:column;
  align-items:center;gap:3.5rem;
}
.logos-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:2rem;
  width:100%;
  opacity:0;
  animation:fadeUp 1s ease 0.5s forwards;
}
.logo-img{
  width:100%;max-width:220px;
  object-fit:contain;display:block;
}
.logo-divider{
  width:1px;height:32px;
  background:var(--line);
}
.brand-copy{
  display:flex;flex-direction:column;
  align-items:center;gap:1rem;
  text-align:center;width:100%;
}
.copy-line{
  font-size:14px;font-weight:300;
  letter-spacing:0.1em;color:var(--white60);
  line-height:1.9;opacity:0;
  transition:opacity 0.8s ease, transform 0.8s ease;
  transform:translateY(12px);
}
.copy-line.visible{
  opacity:1;transform:translateY(0);
}
.qr-wrap{
  text-align:center;opacity:0;
  animation:fadeUp 1s ease 5s forwards;
}
.qr-label{
  font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--white25);margin-bottom:1.2rem;
}
.line-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:#06C755;color:#fff;
  font-size:11px;font-weight:500;letter-spacing:0.15em;
  padding:14px 28px;border-radius:100px;
  text-decoration:none;margin-bottom:0.8rem;
  transition:opacity 0.2s;
}
.line-btn:hover,.line-btn:active{opacity:0.85;}
.qr-sub{
  font-size:9px;letter-spacing:0.15em;
  color:var(--accent);display:block;
}
</style>

<script>
/* 滾動到品牌區塊時觸發文案一句一句浮現 */
const copyLines = document.querySelectorAll('.copy-line');
const delays = [0.3, 1.1, 1.9, 2.7];
let triggered = false;

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && !triggered) {
      triggered = true;
      copyLines.forEach((line, i) => {
        setTimeout(() => {
          line.classList.add('visible');
        }, delays[i] * 1000);
      });
    }
  });
}, { threshold: 0.2 });

const brandSection = document.getElementById('brandSection');
if (brandSection) observer.observe(brandSection);
</script>
