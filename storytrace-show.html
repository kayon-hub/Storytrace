<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演出控台 | Storytrace</title>
<script src="storytrace-gate.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080808;
  --surface: #111;
  --surface2: #1a1a1a;
  --border: rgba(255,255,255,0.08);
  --gold: #C9A84C;
  --gold-dim: rgba(201,168,76,0.15);
  --text: #f0f0f0;
  --muted: rgba(240,240,240,0.35);
  --green: #00E5A0;
  --red: #ff4455;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
  padding: 0 0 80px;
}

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,8,8,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex; align-items: center; gap: 12px;
}
.topbar-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--gold); flex: 1; }
.topbar-room { font-size: 11px; color: var(--muted); }
.topbar-ver { font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 1px; margin-right: 10px; }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.conn-dot.on { background: var(--green); }

/* ── SECTIONS ── */
.section { padding: 20px; border-bottom: 1px solid var(--border); }
.sec-label {
  font-size: 9px; letter-spacing: 2.5px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 12px;
}

/* ── ROOM BAR ── */
.room-row { display: flex; gap: 8px; }
.room-input {
  flex: 1; padding: 10px 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
}
.room-input::placeholder { color: var(--muted); }
.room-btn {
  padding: 10px 18px; background: white; color: #000;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
}

/* ── PLAYER ── */
.player-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
}
.song-info { margin-bottom: 16px; }
.song-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.song-meta { font-size: 11px; color: var(--muted); }

.progress-wrap { margin-bottom: 16px; }
.progress-bar-bg {
  width: 100%; height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 2px; cursor: pointer; position: relative;
}
.progress-bar-fill {
  height: 100%; background: var(--gold);
  border-radius: 2px; width: 0%; transition: width 0.5s linear;
  pointer-events: none;
}
.progress-markers { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.cue-marker {
  position: absolute; top: -3px; width: 2px; height: 10px;
  background: rgba(201,168,76,0.7); border-radius: 1px;
  transform: translateX(-50%);
}

.time-row {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

.player-controls { display: flex; gap: 10px; align-items: center; }
.ctrl-btn {
  padding: 12px 20px; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
}
.ctrl-btn:active { opacity: 0.7; }
.ctrl-play { background: var(--gold); color: #000; flex: 1; }
.ctrl-pause { background: var(--surface2); border: 1px solid var(--border); color: var(--text); flex: 1; }
.ctrl-stop { background: var(--surface2); border: 1px solid rgba(255,68,85,0.3); color: var(--red); }
.ctrl-skip { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

/* ── SONG LIST ── */
.song-list { display: flex; flex-direction: column; gap: 8px; }
.song-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  transition: border-color 0.15s;
}
.song-item:hover { border-color: rgba(201,168,76,0.3); }
.song-item.active { border-color: var(--gold); background: var(--gold-dim); }
.song-num { font-size: 11px; color: var(--muted); width: 18px; text-align: center; flex-shrink: 0; }
.song-item-title { flex: 1; font-size: 14px; font-weight: 600; }
.song-item-dur { font-size: 11px; color: var(--muted); }
.song-cue-count { font-size: 10px; color: var(--gold); background: var(--gold-dim); padding: 2px 7px; border-radius: 10px; }

/* ── CUE LIST ── */
.cue-list { display: flex; flex-direction: column; gap: 6px; }
.cue-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 10px;
  transition: border-color 0.15s;
}
.cue-row.firing { border-color: var(--gold); background: var(--gold-dim); }
.cue-time {
  font-size: 12px; color: var(--gold); font-weight: 700;
  min-width: 44px; font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.cue-swatch { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; }
.cue-body { flex: 1; min-width: 0; }
.cue-type { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.cue-msg { font-size: 13px; margin-top: 2px; }
.cue-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cue-pos { font-size: 10px; color: rgba(201,168,76,0.5); margin-top: 3px; }

/* ── STATUS ── */
.show-status {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px;
}
.status-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 1px;
}
.badge-stopped { background: rgba(255,68,85,0.15); color: var(--red); }
.badge-playing { background: rgba(0,229,160,0.15); color: var(--green); }
.badge-paused  { background: rgba(201,168,76,0.15); color: var(--gold); }
.badge-waiting { background: rgba(255,255,255,0.08); color: var(--muted); }
.status-text { flex: 1; font-size: 12px; color: var(--muted); }

/* ── MANUAL OVERRIDE ── */
.override-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ov-btn {
  padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted); font-size: 12px; cursor: pointer;
}
.ov-btn:active { opacity: 0.7; }

/* ── IMPORT/EXPORT ── */
.ie-row { display: flex; gap: 8px; }
.ie-btn {
  flex: 1; padding: 11px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center;
}
.ie-import { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
.ie-export { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); }

/* ── UPLOAD AREA ── */
.upload-area {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 28px; text-align: center; cursor: pointer;
  transition: border-color 0.2s;
}
.upload-area:hover, .upload-area.drag { border-color: rgba(201,168,76,0.5); }
.upload-text { font-size: 13px; color: var(--muted); }
.upload-sub { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 6px; }

/* ── BANNER（錯誤／警告，取代 alert）── */
.banner {
  position: sticky; top: 45px; z-index: 99;
  padding: 9px 20px; font-size: 12px; line-height: 1.5;
  border-bottom: 1px solid var(--border);
}
.banner.error { background: #3a0a10; color: #ff8899; border-bottom-color: rgba(255,68,85,0.5); }
.banner.warn  { background: #33280a; color: var(--gold); border-bottom-color: rgba(201,168,76,0.4); }
.banner.info  { background: #0a2a20; color: var(--green); border-bottom-color: rgba(0,229,160,0.3); }
.audio-meta { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 14px; }

/* ── UTILS ── */
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="conn-dot" id="connDot"></div>
  <div class="topbar-title">STORYTRACE SHOW</div>
  <div class="topbar-ver" id="verTag">v2026-09-05.2</div>
  <div class="topbar-room" id="topbarRoom">Room: —</div>
</div>
<div id="banner" class="banner" hidden></div>

<!-- ROOM -->
<div class="section">
  <div class="sec-label">場次 Room</div>
  <div class="room-row">
    <input type="text" id="roomInput" class="room-input" placeholder="例如：wedding_0510" value="test01">
    <button class="room-btn" id="roomBtn">確認</button>
  </div>
</div>

<!-- SHOW STATUS -->
<div class="section">
  <div class="sec-label">演出狀態</div>
  <div class="show-status">
    <div class="status-badge badge-stopped" id="statusBadge">STOPPED</div>
    <div class="status-text" id="statusText">尚未開始</div>
  </div>
</div>

<!-- PLAYER -->
<div class="section">
  <div class="sec-label">播放器</div>
  <div class="player-card">
    <!-- 音樂選檔 -->
    <div style="margin-bottom:16px;">
      <div style="font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">音樂來源</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="audioPickBtn" style="padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;flex:1;text-align:left;">
          🎵 選擇音樂檔案
        </button>
        <div id="audioFileName" style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未選擇</div>
        <button id="toneBtn" title="播 1 秒嗶聲，確認瀏覽器跟喇叭這條路通不通" style="padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;">🔔 測試音</button>
      </div>
      <audio id="testTone" style="display:none"></audio>
      <div class="audio-meta" id="audioMeta"></div>
      <input type="file" id="audioFileInput" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg,audio/*" style="display:none">
    </div>
    <!-- 隱藏的 audio 元素 -->
    <audio id="audioPlayer" style="display:none"></audio>
    <div class="song-info">
      <div class="song-title" id="playerSongTitle">— 尚未選擇歌曲 —</div>
      <div class="song-meta" id="playerSongMeta">載入演出資料後選擇歌曲</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg" id="progressBg">
        <div class="progress-bar-fill" id="progressFill"></div>
        <div class="progress-markers" id="progressMarkers"></div>
      </div>
      <div class="time-row">
        <span id="timeNow">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn ctrl-play" id="playBtn">▶ 開始演出</button>
      <button class="ctrl-btn ctrl-pause" id="pauseBtn">⏸ 暫停</button>
      <button class="ctrl-btn ctrl-stop" id="stopBtn">■</button>
    </div>
    <div class="player-controls mt8">
      <button class="ctrl-btn ctrl-skip" id="prevBtn" style="flex:1">← 上一首</button>
      <button class="ctrl-btn ctrl-skip" id="nextBtn" style="flex:1">下一首 →</button>
    </div>
    <div class="player-controls mt8">
      <button class="ctrl-btn ctrl-skip" id="lightsOnlyBtn" style="flex:1;font-weight:400;color:var(--muted);font-size:12px;">沒有音樂檔？純燈光播放（不放音樂，用系統時鐘計時）</button>
    </div>
  </div>
</div>

<!-- SONG LIST -->
<div class="section">
  <div class="sec-label">曲目</div>
  <div class="song-list" id="songList">
    <div style="font-size:13px;color:var(--muted);padding:12px 0;">尚未載入演出資料</div>
  </div>
</div>

<!-- CUE LIST -->
<div class="section">
  <div class="sec-label">Cue 時間軸 <span id="cueCount" style="color:var(--gold);"></span></div>
  <div class="cue-list" id="cueList">
    <div style="font-size:13px;color:var(--muted);padding:12px 0;">選擇歌曲後顯示 cue 列表</div>
  </div>
</div>

<!-- MANUAL OVERRIDE -->
<div class="section">
  <div class="sec-label">手動接管</div>
  <div class="override-row">
    <button class="ov-btn" data-color="hsl(340,100%,50%)">● 玫瑰紅</button>
    <button class="ov-btn" data-color="hsl(45,100%,50%)">● 金色</button>
    <button class="ov-btn" data-color="hsl(0,0%,100%)">● 純白</button>
    <button class="ov-btn" data-color="hsl(325,100%,55%)">● 粉紅</button>
    <button class="ov-btn" data-off="1">⬛ 關燈</button>
  </div>
</div>

<!-- IMPORT/EXPORT -->
<div class="section">
  <div class="sec-label">演出資料</div>
  <div class="upload-area" id="uploadArea">
    <div class="upload-text">📂 點擊或拖入 show.json</div>
    <div class="upload-sub">每場婚禮更換 JSON 即可，不需改程式碼</div>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
  <div class="ie-row mt8">
    <button class="ie-btn ie-export" id="exportBtn">↓ 匯出目前演出資料</button>
  </div>
</div>

<script>
// ============================================================
//  Storytrace 演出控台 — classic script（非 module）
//  - DOM 事件綁定等 gate.js 判定完（DOMContentLoaded 之後）才做；鎖定畫面中就不初始化，解鎖 reload 後再跑
//  - Firebase 用動態 import() 載入：載入失敗只影響送指令，不會讓選檔／拖曳整個失效，畫面上直接紅字講原因
//  - 有音樂檔時一律以 audio.currentTime 為計時基準
// ============================================================
(function () {
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyDAiYEuJtBppTJWrl90OBS7_vcCtrSI3jk",
  authDomain: "storytrace-wedding.firebaseapp.com",
  databaseURL: "https://storytrace-wedding-default-rtdb.firebaseio.com",
  projectId: "storytrace-wedding",
  storageBucket: "storytrace-wedding.firebasestorage.app",
  messagingSenderId: "865058497448",
  appId: "1:865058497448:web:f604e62c4c7407f464b39d"
};

const $ = (id) => document.getElementById(id);

// ── STATE ──
let db = null, fbRef = null, fbSet = null;
let fbReady = false;
let currentRoom = 'test01';
let showData = null;         // 完整 JSON
let currentSongIdx = 0;
let playState = 'stopped';   // stopped | playing | paused
let startedAt = null;        // 純燈光模式的時鐘基準（Date.now()）
let pausedAtSec = 0;         // 暫停／定位點（秒）
let timerId = null;
let lastCueFired = {};       // { cueId: true }
let audioReady = false;      // 目前這首有可播的音檔（metadata 已讀到）
let usingAudio = false;      // 這次播放是不是用音檔當時鐘（播放開始時決定，中途不變）
let lightsOnlyOptIn = false; // 使用者明確按了「純燈光播放」
let audioStallWarned = false;
const songAudio = {};        // { songId: { src, label, kind } } 每首各自記住選過的音檔
let audio = null;

// ── BANNER（取代 alert）──
let bannerTimer = null;
function showBanner(msg, level) {
  const el = $('banner'); if (!el) return;
  el.textContent = msg;
  el.className = 'banner ' + (level || 'info');
  el.hidden = false;
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
  if (level !== 'error') bannerTimer = setTimeout(hideBanner, 8000);   // 警告／提示 8 秒自動收，錯誤留著（點一下可關）
}
function hideBanner() { const el = $('banner'); if (el) el.hidden = true; if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; } }

// ── FIREBASE（動態載入）──
async function connectFirebase() {
  try {
    const [appMod, dbMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js'),
    ]);
    const app = appMod.initializeApp(firebaseConfig);
    db = dbMod.getDatabase(app);
    fbRef = dbMod.ref; fbSet = dbMod.set;
    fbReady = true;
    dbMod.onValue(dbMod.ref(db, '.info/connected'), (snap) => {
      const on = !!snap.val();
      $('connDot').classList.toggle('on', on);
      $('connDot').title = on ? 'Firebase 已連線' : 'Firebase 斷線中';
      if (on) { if ($('banner').textContent.startsWith('Firebase 斷線')) hideBanner(); }
      else showBanner('Firebase 斷線中，重連中…（指令會等連上後補送）', 'warn');
    });
  } catch (err) {
    fbReady = false;
    $('connDot').classList.remove('on');
    showBanner('Firebase 載入失敗：' + ((err && err.message) || err) + '。檢查網路後重新整理；選檔／預覽仍可用，但指令送不到手機。', 'error');
  }
}

function fbWrite(path, value) {
  if (!fbReady) { showBanner('Firebase 尚未連線，這個指令沒送出（' + path + '）', 'warn'); return Promise.resolve(); }
  return fbSet(fbRef(db, 'rooms/' + currentRoom + '/' + path), value)
    .catch(err => showBanner('寫入 Firebase 失敗（' + path + '）：' + err.message, 'error'));
}
function writeControl(obj) { return fbWrite('control', Object.assign({}, obj, { ts: Date.now() })); }
function writeShow(obj)    { return fbWrite('show',    Object.assign({}, obj, { updatedAt: Date.now() })); }
function writeLyrics(obj)  { return fbWrite('lyrics',  obj); }   // null＝清掉

// ── ROOM ──
function setRoom() {
  const val = $('roomInput').value.trim().replace(/\s+/g, '_') || 'test01';
  currentRoom = val;
  $('roomInput').value = val;
  $('topbarRoom').textContent = 'Room: ' + val;
}

// ── AUDIO ──
function currentSong() { return showData ? showData.songs[currentSongIdx] : null; }

function effectiveDuration() {
  const song = currentSong(); if (!song) return 0;
  const audioDur = (audioReady && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 0;
  const useAudio = playState === 'stopped' ? audioReady : usingAudio;
  return (useAudio && audioDur) ? audioDur : (Number(song.durationSec) || 0);
}

function isHttpUrl(s) { return typeof s === 'string' && /^https?:\/\//i.test(s); }

function setAudioSource(src, label, kind) {
  if (audio.src && audio.src.startsWith('blob:')) { try { URL.revokeObjectURL(audio.src); } catch (e) {} }
  audioReady = false;
  audio.src = src;
  $('audioFileName').textContent = label;
  $('audioPickBtn').textContent = '✅ ' + (label.length > 22 ? label.slice(0, 22) + '…' : label);
  $('audioMeta').textContent = kind === 'url' ? '從網址載入中…' : '讀取檔案中…';
  audio.load();
}

function clearAudioSource(reason) {
  if (audio.src && audio.src.startsWith('blob:')) { try { URL.revokeObjectURL(audio.src); } catch (e) {} }
  audioReady = false;
  audio.removeAttribute('src');
  try { audio.load(); } catch (e) {}
  $('audioFileName').textContent = reason || '未選擇';
  $('audioPickBtn').textContent = '🎵 選擇音樂檔案';
  $('audioMeta').textContent = '';
}

function refreshDurationUI() {
  const song = currentSong(); if (!song) return;
  const dur = effectiveDuration();
  $('timeTotal').textContent = fmtSec(dur);
  if (audioReady && isFinite(audio.duration)) {
    const diff = Math.abs(audio.duration - (Number(song.durationSec) || 0));
    $('audioMeta').textContent = '音檔長度 ' + fmtSec(audio.duration) +
      (diff > 1 ? '（JSON 寫 ' + fmtSec(song.durationSec) + '，以音檔為準）' : '') +
      ' · 計時基準：audio.currentTime';
  }
}

// 選歌時決定音檔來源：這首選過檔 → 用那個；filename 是 https:// → 直接載；否則純燈光模式
function applySongAudio(song) {
  const saved = songAudio[song.id];
  if (saved) { setAudioSource(saved.src, saved.label, saved.kind); return; }
  if (isHttpUrl(song.filename)) {
    let label = song.filename.split('/').pop() || song.filename;
    try { label = decodeURIComponent(label); } catch (e) {}
    songAudio[song.id] = { src: song.filename, label: label, kind: 'url' };
    setAudioSource(song.filename, songAudio[song.id].label, 'url');
    return;
  }
  clearAudioSource('未選擇（' + (song.filename || '此曲') + '）');
}

// ── 載入 JSON ──
function validateShow(data) {
  if (!data || typeof data !== 'object') throw new Error('不是 JSON 物件');
  if (!Array.isArray(data.songs) || data.songs.length === 0) throw new Error('格式錯誤：缺少 songs 陣列');
  data.songs.forEach((s, i) => {
    if (!s.id) s.id = 'song_' + (i + 1);
    if (!s.title) s.title = '未命名曲目 ' + (i + 1);
    if (!Array.isArray(s.cues)) throw new Error('第 ' + (i + 1) + ' 首缺少 cues 陣列');
    s.cues.forEach((c, j) => {
      if (typeof c.timeSec !== 'number') throw new Error('第 ' + (i + 1) + ' 首第 ' + (j + 1) + ' 個 cue 的 timeSec 不是數字');
      if (!c.id) c.id = s.id + '_c' + (j + 1);
    });
    s.cues.sort((a, b) => a.timeSec - b.timeSec);
  });
}

function loadShow(data) {
  showData = data;
  currentSongIdx = 0;
  lastCueFired = {};
  playState = 'stopped'; pausedAtSec = 0; startedAt = null; stopLoop();
  renderSongList();
  selectSong(0);
  updateStatus('stopped', '演出資料已載入，按「開始演出」');
}

function readShowFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      validateShow(data);
      loadShow(data);
      $('uploadArea').querySelector('.upload-text').textContent = '✅ ' + (data.showId || file.name);
      hideBanner();
    } catch (err) {
      showBanner('載入失敗（' + file.name + '）：' + err.message, 'error');
    }
  };
  reader.onerror = () => showBanner('讀檔失敗：' + file.name, 'error');
  reader.readAsText(file);
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderSongList() {
  if (!showData) return;
  $('songList').innerHTML = showData.songs.map((s, i) => `
    <div class="song-item ${i === currentSongIdx ? 'active' : ''}" data-idx="${i}">
      <div class="song-num">${i + 1}</div>
      <div class="song-item-title">${esc(s.title)}</div>
      <div class="song-item-dur">${fmtSec(s.durationSec)}</div>
      <div class="song-cue-count">${s.cues.length} cues</div>
    </div>
  `).join('');
}

function selectSong(idx) {
  if (!showData) return;
  if (playState !== 'stopped') stopShow();
  currentSongIdx = idx;
  const song = showData.songs[idx];
  renderSongList();
  renderCueList();
  applySongAudio(song);
  renderProgressMarkers();
  $('playerSongTitle').textContent = song.title;
  $('playerSongMeta').textContent = '時長 ' + fmtSec(song.durationSec) + '  ·  ' + song.cues.length + ' 個 cue  ·  ' + (song.filename || '');
  $('timeTotal').textContent = fmtSec(song.durationSec);
  renderTime(0);
}

function renderCueList() {
  if (!showData) return;
  const song = currentSong();
  $('cueCount').textContent = '(' + song.cues.length + ')';
  $('cueList').innerHTML = song.cues.map(cue => {
    const swatchStyle = cue.color
      ? 'background:' + esc(cue.color) + ';border:1px solid rgba(255,255,255,0.2)'
      : 'background:rgba(255,255,255,0.1);border:1px dashed rgba(255,255,255,0.2)';
    const lyricsPreview = cue.type === 'lyrics' && cue.text
      ? `<div style="font-size:13px;margin-top:4px;color:rgba(255,255,255,0.8);">${esc(cue.text)}</div>
         <div style="font-size:10px;color:var(--gold);margin-top:2px;">${cue.words ? cue.words.length + ' 個字' : ''}</div>`
      : '';
    return `
      <div class="cue-row" id="cue_${esc(cue.id)}">
        <div class="cue-time">${fmtSec(cue.timeSec)}</div>
        <div class="cue-swatch" style="${swatchStyle}"></div>
        <div class="cue-body">
          <div class="cue-type">${cue.type === 'lyrics' ? '🎤 lyrics' : esc(cue.type)}${cue.oneShot ? ' · 一次性' : ''}</div>
          ${lyricsPreview}
          ${cue.message ? `<div class="cue-msg">${esc(cue.message)}</div>` : ''}
          ${cue.note ? `<div class="cue-note">📋 ${esc(cue.note)}</div>` : ''}
          ${cue.position ? `<div class="cue-pos">📍 ${esc(cue.position)}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderProgressMarkers() {
  if (!showData) return;
  const song = currentSong();
  const dur = effectiveDuration() || 1;
  $('progressMarkers').innerHTML = song.cues.map(cue => {
    const pct = Math.min(100, (cue.timeSec / dur) * 100);
    return `<div class="cue-marker" style="left:${pct}%" title="${fmtSec(cue.timeSec)} ${esc(cue.note || '')}"></div>`;
  }).join('');
}

function renderTime(sec) {
  const dur = effectiveDuration();
  const pct = dur > 0 ? Math.min((sec / dur) * 100, 100) : 0;
  $('progressFill').style.width = pct + '%';
  $('timeNow').textContent = fmtSec(sec);
}

// ── PLAYBACK ──
async function playShow(opts) {
  opts = opts || {};
  if (!showData) { showBanner('請先載入演出資料（show.json）', 'warn'); return; }
  if (playState === 'playing') return;
  const song = currentSong();
  const resuming = playState === 'paused';
  if (!resuming) {
    pausedAtSec = 0; lastCueFired = {};
    lightsOnlyOptIn = !!opts.lightsOnly;
    // 沒載到音檔就按「開始演出」→ 直接擋下講清楚，不要靜靜跑成沒音樂的演出
    if (!audioReady && !lightsOnlyOptIn) {
      if (audio.getAttribute('src') && !audio.error) {
        showBanner('音檔還在讀取中（' + $('audioFileName').textContent + '）：等下面出現「音檔長度」再按「開始演出」', 'warn');
      } else {
        showBanner('沒有載到音樂：請先按「🎵 選擇音樂檔案」選『' + (song.filename || '這首的音檔') + '』，再按「開始演出」。只跑燈光不放音樂，請按「純燈光播放」。', 'error');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    usingAudio = audioReady && !lightsOnlyOptIn;
    audioStallWarned = false;
  }

  if (usingAudio) {
    try { audio.currentTime = pausedAtSec; } catch (e) {}
    try { await audio.play(); }
    catch (e) {
      showBanner('瀏覽器擋下播放（' + e.message + '），請再按一次「開始演出」', 'error');
      return;
    }
  } else {
    startedAt = Date.now() - pausedAtSec * 1000;
  }

  playState = 'playing';
  updateStatus('playing', '▶ ' + song.title + (usingAudio ? '　🔊 音檔播放中' : '（純燈光模式：不放音樂，用系統時鐘計時）'));
  writeShow({
    state: 'playing',
    showId: showData.showId || '',
    songId: song.id,
    songIdx: currentSongIdx,
    startedAt: Date.now() - pausedAtSec * 1000,
    durationSec: effectiveDuration()
  });
  if (resuming) syncLightsAt(pausedAtSec);   // 暫停期間若被手動接管過，續播時把燈光對回 cue 狀態
  startLoop();
}

function pauseShow() {
  if (playState !== 'playing') return;
  pausedAtSec = getElapsedSec();
  playState = 'paused';
  if (usingAudio) audio.pause();
  stopLoop();
  renderTime(pausedAtSec);
  updateStatus('paused', '⏸ ' + fmtSec(pausedAtSec) + ' 暫停');
  writeShow({ state: 'paused', pausedAtSec: pausedAtSec });
}

function stopShow(opts) {
  opts = opts || {};
  playState = 'stopped';
  startedAt = null;
  pausedAtSec = 0;
  lastCueFired = {};
  if (audioReady) { audio.pause(); try { audio.currentTime = 0; } catch (e) {} }
  usingAudio = false; lightsOnlyOptIn = false;
  stopLoop();
  updateStatus('stopped', opts.text || '已停止');
  writeShow({ state: 'stopped' });
  writeControl({ type: 'off' });
  writeLyrics(null);
  renderTime(0);
  document.querySelectorAll('.cue-row.firing').forEach(el => el.classList.remove('firing'));
}

function nextSong() {
  if (!showData) return;
  stopShow();
  selectSong((currentSongIdx + 1) % showData.songs.length);
}
function prevSong() {
  if (!showData) return;
  stopShow();
  selectSong((currentSongIdx - 1 + showData.songs.length) % showData.songs.length);
}

function onSongEnd() {
  if (currentSongIdx < showData.songs.length - 1) {
    nextSong();
    setTimeout(playShow, 500);
  } else {
    stopShow({ text: '演出結束' });
  }
}

function seekToClick(e) {
  if (!showData) return;
  const rect = $('progressBg').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  seekTo(pct * effectiveDuration());
}

// 跳轉：跳轉點之前的 cue 視為已過（不重播），只補送最近一個顏色讓手機燈光對齊
function seekTo(sec) {
  if (!showData) return;
  const song = currentSong();
  const pos = Math.max(0, Math.min(Number(sec) || 0, effectiveDuration()));
  pausedAtSec = pos;
  if (audioReady) { try { audio.currentTime = pos; } catch (e) {} }
  lastCueFired = {};
  song.cues.forEach(c => { if (c.timeSec <= pos) lastCueFired[c.id] = true; });
  if (playState === 'playing') {
    startedAt = Date.now() - pos * 1000;
    syncLightsAt(pos);
    writeShow({ state: 'playing', showId: showData.showId || '', songId: song.id, songIdx: currentSongIdx, startedAt: startedAt, durationSec: effectiveDuration() });
  } else {
    playState = 'paused';   // 停止中點進度條＝定位，按「開始演出」從這裡播
    updateStatus('paused', '已定位 ' + fmtSec(pos) + '，按「開始演出」從這裡播');
  }
  renderTime(pos);
  highlightActiveCue(pos);
}

function syncLightsAt(sec) {
  const song = currentSong(); if (!song) return;
  const past = song.cues.filter(c => c.timeSec <= sec);
  if (!past.length) return;
  const last = past[past.length - 1];
  if (last.type === 'off') { writeControl({ type: 'off' }); return; }
  const lastColor = past.slice().reverse().find(c => c.color);
  if (lastColor) writeControl({ type: 'color', color: lastColor.color, message: '', transition: 0.3 });
}

// ── LOOP（setInterval＋timeupdate，不用 rAF：分頁在背景時 rAF 會整個停掉，音樂還在跑 cue 卻不送）──
function startLoop() {
  stopLoop();
  timerId = setInterval(tick, 50);
  tick();
}
function stopLoop() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function getElapsedSec() {
  if (usingAudio) return audio.currentTime;                 // 用音檔播放：唯一基準
  if (playState === 'stopped' && audioReady) return audio.currentTime;
  if (playState === 'playing' && startedAt) return (Date.now() - startedAt) / 1000;
  return pausedAtSec;
}

function tick() {
  if (playState !== 'playing' || !showData) return;
  const song = currentSong();
  const elapsed = getElapsedSec();
  renderTime(elapsed);

  for (const cue of song.cues) {
    if (elapsed >= cue.timeSec && !lastCueFired[cue.id]) {
      lastCueFired[cue.id] = true;
      fireCue(cue);
    }
  }
  highlightActiveCue(elapsed);

  // 用音檔播放時若瀏覽器把音檔停住（被系統打斷等），警告一次
  if (usingAudio && audio.paused && !audio.ended && !audioStallWarned) {
    audioStallWarned = true;
    showBanner('音檔被瀏覽器暫停了（' + fmtSec(elapsed) + '），請按「暫停」再按「開始演出」續播', 'warn');
  }
  // 純燈光模式才用 durationSec 判斷結束；用音檔靠 ended 事件
  if (!usingAudio && elapsed >= effectiveDuration()) onSongEnd();
}

function highlightActiveCue(elapsed) {
  const song = currentSong(); if (!song) return;
  let active = null;
  for (const c of song.cues) { if (elapsed >= c.timeSec) active = c; else break; }
  document.querySelectorAll('.cue-row.firing').forEach(el => el.classList.remove('firing'));
  if (active) { const el = $('cue_' + active.id); if (el) el.classList.add('firing'); }
}

// ── FIRE CUE → Firebase ──
function fireCue(cue) {
  const transition = (typeof cue.transitionSec === 'number') ? cue.transitionSec : null;
  if (cue.type === 'color') {
    writeControl({ type: 'color', color: cue.color || '#000', message: cue.message || '', transition: transition == null ? 1.2 : transition });
  } else if (cue.type === 'off') {
    writeControl({ type: 'off' });
  } else if (cue.type === 'message') {
    writeControl({ type: 'message', message: cue.message || '' });
  } else if (cue.type === 'lyrics') {
    if (cue.color) {
      writeControl({ type: 'color', color: cue.color, message: '', transition: transition == null ? 0.3 : transition });
    }
    writeLyrics({
      type: 'lyrics',
      cueId: cue.id,
      text: cue.text || '',
      words: Array.isArray(cue.words) ? cue.words : [],
      highlightColor: cue.highlightColor || '#ffffff',
      ts: Date.now()
    });
  }
}

// ── MANUAL OVERRIDE ──
function manualColor(color) {
  if (playState === 'playing') pauseShow();
  writeControl({ type: 'color', color: color, message: '' });
}
function manualOff() {
  if (playState === 'playing') pauseShow();
  writeControl({ type: 'off' });
  writeLyrics(null);
}

// ── STATUS UI ──
function updateStatus(state, text) {
  const badge = $('statusBadge');
  badge.className = 'status-badge';
  if (state === 'playing') badge.classList.add('badge-playing');
  else if (state === 'paused') badge.classList.add('badge-paused');
  else badge.classList.add('badge-stopped');
  badge.textContent = state.toUpperCase();
  $('statusText').textContent = text;
}

// ── EXPORT ──
function exportShow() {
  if (!showData) { showBanner('尚未載入演出資料', 'warn'); return; }
  const blob = new Blob([JSON.stringify(showData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (showData.showId || 'show') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── UTILS ──
function buildToneWav(freq, seconds) {
  const sr = 44100, n = Math.floor(sr * seconds);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const env = Math.min(1, i / 2000, (n - i) / 2000);       // 淡入淡出避免爆音
    v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * freq * i / sr) * 0.35 * env * 32767), true);
  }
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return 'data:audio/wav;base64,' + btoa(bin);
}

function fmtSec(s) {
  s = Number(s); if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

// ── 初始化（DOMContentLoaded 之後、確認不是 gate 鎖定畫面才綁）──
function init() {
  audio = $('audioPlayer');

  $('banner').addEventListener('click', hideBanner);
  $('banner').style.cursor = 'pointer';

  // 整頁擋掉瀏覽器預設的拖放行為：演出中誤拖檔案到頁面不會把控台整頁換掉
  document.addEventListener('dragover', (e) => { e.preventDefault(); });
  document.addEventListener('drop', (e) => { e.preventDefault(); });

  // Room
  $('roomBtn').addEventListener('click', setRoom);
  $('roomInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') setRoom(); });
  setRoom();

  // Show JSON：點擊／拖曳
  const uploadArea = $('uploadArea');
  const fileInput = $('fileInput');
  uploadArea.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
  uploadArea.addEventListener('dragenter', (e) => { e.preventDefault(); uploadArea.classList.add('drag'); });
  uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; uploadArea.classList.add('drag'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('drag');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) { showBanner('拖進來的不是檔案', 'warn'); return; }
    if (!/\.json$/i.test(file.name) && file.type !== 'application/json') { showBanner('請拖入 .json 檔（拖進來的是 ' + file.name + '）', 'warn'); return; }
    readShowFile(file);
  });
  fileInput.addEventListener('change', (e) => readShowFile(e.target.files && e.target.files[0]));
  $('exportBtn').addEventListener('click', exportShow);

  // 音樂選檔
  const audioInput = $('audioFileInput');
  $('audioPickBtn').addEventListener('click', () => { audioInput.value = ''; audioInput.click(); });
  audioInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (playState !== 'stopped') stopShow();
    const src = URL.createObjectURL(file);
    const song = currentSong();
    if (song) songAudio[song.id] = { src: src, label: file.name, kind: 'file' };
    setAudioSource(src, file.name, 'file');
  });
  audio.addEventListener('loadedmetadata', () => {
    audioReady = true;
    refreshDurationUI();
    renderProgressMarkers();
    renderTime(pausedAtSec);
    if ($('banner').textContent.startsWith('音樂檔載入失敗')) hideBanner();
  });
  audio.addEventListener('error', () => {
    if (!audio.getAttribute('src')) return;   // 清除來源時的 error 不算
    audioReady = false;
    $('audioMeta').textContent = '';
    $('audioFileName').textContent = '載入失敗';
    showBanner('音樂檔載入失敗（格式不支援、檔案損壞或網址錯誤），目前為純燈光模式', 'error');
  });
  audio.addEventListener('ended', () => { if (playState === 'playing' && usingAudio) onSongEnd(); });
  audio.addEventListener('timeupdate', () => { if (playState === 'playing') tick(); });

  // 播放控制
  $('playBtn').addEventListener('click', () => playShow());
  $('lightsOnlyBtn').addEventListener('click', () => playShow({ lightsOnly: true }));

  // 測試音：1 秒 440Hz 嗶聲走同一個瀏覽器輸出路徑（跟音檔無關）
  $('toneBtn').addEventListener('click', () => {
    const tone = $('testTone');
    if (!tone.getAttribute('src')) tone.src = buildToneWav(440, 1.0);
    tone.currentTime = 0;
    tone.play()
      .then(() => showBanner('正在播 1 秒嗶聲。聽得到＝瀏覽器跟喇叭這條路正常，問題在音檔；聽不到＝檢查這台電腦的輸出裝置與音量（Safari 分頁有沒有被靜音）。', 'info'))
      .catch(e => showBanner('測試音被擋下：' + e.message, 'error'));
  });
  $('pauseBtn').addEventListener('click', pauseShow);
  $('stopBtn').addEventListener('click', () => stopShow());
  $('prevBtn').addEventListener('click', prevSong);
  $('nextBtn').addEventListener('click', nextSong);
  $('progressBg').addEventListener('click', seekToClick);

  // 曲目（事件委派）
  $('songList').addEventListener('click', (e) => {
    const item = e.target.closest('.song-item[data-idx]');
    if (item) selectSong(Number(item.dataset.idx));
  });

  // 手動接管
  document.querySelectorAll('.ov-btn[data-color]').forEach(btn => btn.addEventListener('click', () => manualColor(btn.dataset.color)));
  document.querySelectorAll('.ov-btn[data-off]').forEach(btn => btn.addEventListener('click', manualOff));

  // 給 console／測試用
  window.storytraceShow = {
    playShow, pauseShow, stopShow, seekTo, selectSong, loadShow, setRoom,
    get state() { return { playState, currentRoom, currentSongIdx, pausedAtSec, audioReady, usingAudio, lightsOnlyOptIn, audioSrc: audio.getAttribute('src') ? (audio.getAttribute('src').slice(0, 30)) : '', audioPaused: audio.paused, audioError: audio.error && audio.error.code, fbReady, elapsed: getElapsedSec(), fired: Object.keys(lastCueFired).length, showId: showData && showData.showId }; }
  };

  console.log('Storytrace show console ' + $('verTag').textContent);
  connectFirebase();
}

function boot() {
  if (!$('uploadArea')) return;   // gate.js 正顯示密碼畫面（body 已被換掉），解鎖後會 reload 再進來
  try { init(); }
  catch (err) {
    showBanner('控台初始化失敗：' + err.message, 'error');
    console.error(err);
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
