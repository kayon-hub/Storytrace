<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Storytrace</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storytrace">
<meta name="theme-color" content="#0D0D0D">
<link rel="apple-touch-icon" href="ICON.png">
<link rel="manifest" href="manifest.json">
<script src="storytrace-auth.js"></script>
<script src="storytrace-fx.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --gold: #C9A84C; --gold-lt: #E8C97A; --cream: #F0EBE0; --muted: rgba(240,235,224,0.45); }
  html, body { height: 100%; }
  body {
    background: #0D0D0D; color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", sans-serif;
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; transition: background 1.2s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body.join-mode::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 50%);
  }
  #bgGlow {
    position: fixed; inset: 0; opacity: 0;
    transition: opacity 1.2s ease, background-color 1.2s ease;
    z-index: 0; filter: saturate(2) brightness(1.2);
  }
  #lightOrbs {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 1; opacity: 0; transition: opacity 1.2s ease;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(28px); animation: float 4s ease-in-out infinite; opacity: 0.95;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.08); }
  }
  .content { position: relative; z-index: 2; text-align: center; padding: 40px 28px 32px; width: 100%; max-width: 380px; }
  #joinScreen { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .join-icon {
    width: 72px; height: 72px; border-radius: 16px; object-fit: cover;
    margin-bottom: 20px; border: 1px solid rgba(201,168,76,0.28);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 34px; font-style: italic; font-weight: 400; letter-spacing: 0.01em; color: #fff; margin-bottom: 8px; }
  .gold-rule { width: 36px; height: 1px; background: var(--gold); margin: 0 auto 22px; }
  .logo { display: none; }
  .join-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.06em; }
  .join-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; line-height: 1.7; }
  .name-input {
    width: 100%; padding: 16px 20px;
    background: #141414; border: 1px solid rgba(201,168,76,0.28);
    border-radius: 12px; color: var(--cream); font-size: 16px;
    text-align: center; margin-bottom: 12px; outline: none; -webkit-appearance: none;
  }
  .name-input:focus { border-color: var(--gold); }
  .name-input::placeholder { color: rgba(240,235,224,0.3); }
  .join-btn {
    width: 100%; min-height: 48px; padding: 14px; background: var(--gold); color: #0D0D0D;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.12em;
  }
  .join-btn:active { transform: scale(0.98); }
  .join-brands { margin-top: 28px; font-size: 9px; letter-spacing: 0.14em; color: rgba(240,235,224,0.28); text-transform: uppercase; line-height: 1.6; }
  #mainScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .event-photo {
    width: 88px; height: 88px; border-radius: 18px;
    background: #141414 url(ICON.png) center/72% no-repeat;
    border: 1px solid rgba(201,168,76,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 0; margin-bottom: 20px; transition: box-shadow 1s, opacity 0.6s; overflow: hidden;
  }
  .event-title { font-size: 26px; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 6px; }
  .event-subtitle { font-size: 11px; color: var(--muted); letter-spacing: 0.22em; margin-bottom: 16px; text-transform: uppercase; }
  .wait-hint { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 28px; }
  body.live-light .event-photo,
  body.live-light .event-subtitle,
  body.live-light .wait-hint,
  body.live-light #myId,
  body.live-light .brand { opacity: 0; pointer-events: none; }
  body.live-light .event-title { opacity: 0.0; }
  body.live-light .scene-message { text-shadow: 0 2px 24px rgba(0,0,0,0.55); }
  .scene-message {
    font-size: 22px; font-weight: 700; min-height: 32px; margin-bottom: 32px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
    text-shadow: 0 0 20px rgba(255,255,255,0.6);
  }
  .scene-message.show { opacity: 1; transform: translateY(0); }
  #myId { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 40px; letter-spacing: 1px; }
  .brand { font-size: 9px; letter-spacing: 0.16em; color: rgba(240,235,224,0.28); text-transform: uppercase; margin-top: 8px; }
  .winner-overlay {
    position: fixed; inset: 0; background: rgba(13,13,13,0.94); z-index: 200;
    display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 32px;
  }
  .winner-emoji {
    width: 48px; height: 48px; margin-bottom: 22px;
    border: 1px solid var(--gold); transform: rotate(45deg);
    animation: none;
  }
  .winner-text { font-size: 28px; font-weight: 600; color: var(--gold-lt); margin-bottom: 12px; letter-spacing: 0.06em; }
  .winner-sub { font-size: 15px; color: var(--muted); line-height: 1.6; }

  /* ── 逐字歌詞 ── */
  #lyricsDisplay {
    position: fixed; bottom: calc(72px + env(safe-area-inset-bottom)); left: 0; right: 0;
    z-index: 50; text-align: center; padding: 0 24px;
    pointer-events: none;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #lyricsDisplay.show { opacity: 1; }
  .lyric-line {
    font-size: 28px; font-weight: 800;
    line-height: 1.4; letter-spacing: 2px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px;
  }
  .lyric-word {
    display: inline-block;
    color: rgba(255,255,255,0.25);
    transition: color 0.15s ease, text-shadow 0.15s ease;
  }
  .lyric-word.lit {
    color: var(--lit, #ffffff);
    text-shadow: 0 0 30px rgba(255,255,255,0.9), 0 0 60px rgba(255,255,255,0.4);
  }
  /* 一個「詞」（空格之間）是一個 run：英文／韓文詞內不斷行，中文 run 內每個字都可斷 */
  .lyric-run { display: inline-block; }
  .lyric-run.nowrap { white-space: nowrap; }
  .lyric-space { display: inline-block; width: 0.35em; }
  .lyric-space.wide { width: 1em; }
  .lyric-gap { display: inline-block; color: rgba(255,255,255,0.25); white-space: pre; }
  .lyric-line.long { font-size: 24px; }
  .lyric-line.xlong { font-size: 21px; letter-spacing: 1px; }
</style>
</head>
<body class="join-mode">
<div id="bgGlow"></div>
<div id="lyricsDisplay"><div class="lyric-line" id="lyricLine"></div></div>
<div id="lightOrbs"></div>
<div id="winnerOverlay" class="winner-overlay">
  <div class="wordmark" style="font-size:20px;margin-bottom:18px;">Storytrace</div>
  <div class="winner-emoji" aria-hidden="true"></div>
  <div class="winner-text" id="winnerText">恭喜你！</div>
  <div class="winner-sub" id="winnerSub">請依現場指示</div>
</div>
<div class="content">
  <div id="joinScreen">
    <img class="join-icon" src="ICON.png" alt="Storytrace">
    <div class="wordmark">Storytrace</div>
    <div class="gold-rule"></div>
    <div class="logo" id="joinLogo"></div>
    <div class="join-title" id="joinTitle">加入這場婚禮</div>
    <div class="join-sub" id="joinSub">手機將成為現場的光。<br>不需要安裝，也不需要帳號。</div>
    <input type="text" id="nameInput" class="name-input" placeholder="你的名字" maxlength="20">
    <button class="join-btn" onclick="joinEvent()">加入</button>
    <div class="join-brands">Storytrace<br>OBARAI INTELLIGENCE · KAYON STUDIO · KARBØN X GAIA ENTERTAINMENT</div>
  </div>
  <div id="mainScreen">
    <div id="eventPhoto" class="event-photo"></div>
    <div id="eventTitle" class="event-title">活動名稱</div>
    <div id="eventSubtitle" class="event-subtitle">STORYTRACE</div>
    <div class="wait-hint" id="waitHint">請讓畫面保持開啟</div>
    <div id="sceneMessage" class="scene-message"></div>
    <div id="myId"></div>
    <div class="brand">OBARAI INTELLIGENCE · KAYON STUDIO · KARBØN X GAIA ENTERTAINMENT</div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeInTRamq4mb3SmB2v2A-OfGjR1KMlD2M",
    authDomain: "storytrace-obarai.firebaseapp.com",
    databaseURL: "https://storytrace-obarai-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "storytrace-obarai",
    storageBucket: "storytrace-obarai.firebasestorage.app",
    messagingSenderId: "749097127431",
    appId: "1:749097127431:web:56d1622f799f7715d864a2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ── 網址參數 ──
  const params = new URLSearchParams(window.location.search);
  const eventType = params.get('event') || 'wedding';
  const roomId    = params.get('room')  || 'default';

  // ── localStorage key（per room，不同活動不互相影響）──
  const STORAGE_KEY = `storytrace_guest_${roomId}`;

  // ── 活動類型預設 ──
  const eventDefaults = {
    wedding:   { logo:'', joinTitle:'加入這場婚禮', joinSub:'手機將成為現場的光。<br>不需要安裝，也不需要帳號。', photo:'', title:params.get('title')||'Alex & Jamie',  subtitle:params.get('subtitle')||'STORYTRACE',    winnerText:'恭喜你！',   winnerSub:'請依現場指示' },
    corporate: { logo:'', joinTitle:'加入這場活動', joinSub:'手機將成為現場的光。<br>不需要安裝，也不需要帳號。', photo:'', title:params.get('title')||'企業活動',    subtitle:params.get('subtitle')||'STORYTRACE',   winnerText:'恭喜得獎！', winnerSub:'請依現場指示' },
    concert:   { logo:'', joinTitle:'加入這場演出', joinSub:'手機將成為現場的光。<br>不需要安裝，也不需要帳號。', photo:'', title:params.get('title')||'演唱會',      subtitle:params.get('subtitle')||'STORYTRACE',       winnerText:'恭喜你！',   winnerSub:'請依現場指示' },
    party:     { logo:'', joinTitle:'加入這場派對', joinSub:'手機將成為現場的光。<br>不需要安裝，也不需要帳號。', photo:'', title:params.get('title')||'派對活動',    subtitle:params.get('subtitle')||'STORYTRACE',            winnerText:'恭喜得獎！', winnerSub:'請依現場指示' },
  };

  const ev = eventDefaults[eventType] || eventDefaults.wedding;
  document.getElementById('joinLogo').textContent      = ev.logo;
  document.getElementById('joinTitle').textContent     = ev.joinTitle;
  document.getElementById('joinSub').innerHTML         = ev.joinSub;
  document.getElementById('eventPhoto').textContent    = ev.photo;
  document.getElementById('eventTitle').textContent    = ev.title;
  document.getElementById('eventSubtitle').textContent = ev.subtitle;
  document.getElementById('winnerText').textContent    = ev.winnerText;
  document.getElementById('winnerSub').textContent     = ev.winnerSub;
  document.title = ev.title + ' | Storytrace';

  // ── Orbs ──
  function createOrbs() {
    const c = document.getElementById('lightOrbs');
    c.innerHTML = '';
    [{x:0,y:0,s:280},{x:55,y:0,s:260},{x:0,y:50,s:300},{x:55,y:50,s:280},{x:25,y:25,s:340}]
      .forEach((p,i) => {
        const o = document.createElement('div');
        o.className = 'orb';
        o.style.cssText = `left:${p.x}%;top:${p.y}%;width:${p.s}px;height:${p.s}px;background:white;animation-delay:${i*0.7}s;animation-duration:${3.5+i*0.4}s;`;
        c.appendChild(o);
      });
  }
  createOrbs();
  if (window.StorytraceFX && window.StorytraceFX.ambient) {
    StorytraceFX.ambient();
    setTimeout(function () { StorytraceFX.onColor('hsl(45,80%,52%)'); }, 800);
  }

  // ── 核心：localStorage 記憶身份 ──
  let guestKey = null;
  let authUid = null;
  // 匿名登入（rules 上鎖後只能寫自己的 guests/{uid}）；Auth 沒啟用就回 null，照舊用 push key
  async function ensureAuth() {
    if (authUid) return authUid;
    const s = await window.StorytraceAuth.signIn(app);
    authUid = s.uid;
    return authUid;
  }

  function getSavedGuest() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
  }
  function saveGuest(key, name) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ key, name }));
  }

  async function registerGuest(name) {
    const uid = await ensureAuth();
    if (uid) {
      guestKey = uid;
      await set(ref(db, `rooms/${roomId}/guests/${uid}`), { name, joinedAt: Date.now() });
    } else {
      const newRef = push(ref(db, `rooms/${roomId}/guests`));
      guestKey = newRef.key;
      await set(newRef, { name, joinedAt: Date.now() });
    }
    saveGuest(guestKey, name);
    return guestKey;
  }

  async function reactivateGuest(savedKey, savedName) {
    const uid = await ensureAuth();
    guestKey = uid || savedKey;
    if (uid && uid !== savedKey) saveGuest(uid, savedName);
    await set(ref(db, `rooms/${roomId}/guests/${guestKey}`), { name: savedName, joinedAt: Date.now() });
  }

  // ── 入場流程 ──
  async function enter(name) {
    document.body.classList.remove('join-mode');
    document.body.classList.add('wait-mode');
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    document.getElementById('myId').textContent = `ID: ${guestKey.slice(-8)}`;

    // 頁面關閉時移除賓客（讓名單保持乾淨）
    window.addEventListener('beforeunload', () => {
      navigator.sendBeacon
        ? navigator.sendBeacon('', '') // fallback
        : set(ref(db, `rooms/${roomId}/guests/${guestKey}`), null);
      set(ref(db, `rooms/${roomId}/guests/${guestKey}`), null);
    });

    listenToControl();
    listenToLyrics();
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
    if (isFxDemo()) {
      const hint = document.getElementById('waitHint');
      if (hint) hint.textContent = '特效預覽 · 點畫面可再看一輪';
      setTimeout(playFxDemoShow, 500);
      document.getElementById('mainScreen').addEventListener('click', playFxDemoShow);
    }
  }

  function isFxDemo() {
    return /(?:\?|&)fxdemo=1(?:&|$)/.test(location.search || '');
  }

  function playFxDemoShow() {
    setLight('hsl(340,100%,50%)', '入場');
    setTimeout(() => { if (window.StorytraceFX) StorytraceFX.onLyric(); }, 1600);
    setTimeout(() => setLight('hsl(45,100%,50%)', '副歌'), 3000);
    setTimeout(() => setLight('hsl(0,0%,96%)', ''), 4800);
    setTimeout(() => showWinner(), 6400);
    setTimeout(() => lightsOff(), 12000);
  }

  // ── 加入按鈕 ──
  window.joinEvent = async function() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { document.getElementById('nameInput').focus(); return; }
    await registerGuest(name);
    await enter(name);
  };

  // ── 頁面載入：檢查有沒有存過 ──
  window.addEventListener('load', async () => {
    const saved = getSavedGuest();
    if (saved && saved.key && saved.name) {
      // 直接復原，不需重填名字
      await reactivateGuest(saved.key, saved.name);
      await enter(saved.name);
    }
    // 沒有存過 → 顯示填名字畫面（預設）
  });

  // ── 監聽控台 ──
  function listenToControl() {
    onValue(ref(db, `rooms/${roomId}/control`), (snap) => {
      const cmd = snap.val();
      if (!cmd) return;
      if (cmd.type === 'color' || cmd.type === 'scene') setLight(cmd.color, cmd.message || '', cmd.transition);
      else if (cmd.type === 'message') showMessage(cmd.message);
      else if (cmd.type === 'off') lightsOff();
      else if (cmd.type === 'lottery' && guestKey && cmd.winner === guestKey) showWinner();
      else if (cmd.type === 'reset') localStorage.removeItem(STORAGE_KEY);
    });
  }

  // ── 監聽歌詞節點（獨立，不覆蓋 control）──
  function listenToLyrics() {
    // onValue 一掛上去會先回「目前的值」——那是上一句（甚至上一場）的舊歌詞，跳過不重播；
    // 之後每次控台寫入才是即時的。控台停止／關燈會把節點清成 null → 收起歌詞。
    let first = true;
    onValue(ref(db, `rooms/${roomId}/lyrics`), (snap) => {
      const cmd = snap.val();
      if (first) { first = false; if (!cmd) hideLyrics(); return; }
      if (!cmd || cmd.type !== 'lyrics') { hideLyrics(); return; }
      showLyrics(cmd);
    });
  }

  // ── 燈光 ──
  function setLight(color, message, transitionSec) {
    document.body.classList.add('live-light');
    document.body.classList.remove('wait-mode');
    const t = (transitionSec != null ? transitionSec : 1.2) + 's';
    const bg = document.getElementById('bgGlow');
    bg.style.transition = `opacity ${t} ease, background-color ${t} ease`;
    document.body.style.transition = `background ${t} ease`;
    document.body.style.background = color;
    bg.style.backgroundColor = color;
    bg.style.opacity = '1';
    document.querySelectorAll('.orb').forEach(o => o.style.background = color);
    document.getElementById('lightOrbs').style.opacity = '1';
    document.getElementById('eventPhoto').style.boxShadow = `0 0 80px ${color}, 0 0 160px ${color}`;
    if (window.StorytraceFX) StorytraceFX.onColor(color);
    if (message) showMessage(message);
  }
  function lightsOff() {
    document.body.classList.remove('live-light');
    document.body.classList.add('wait-mode');
    document.getElementById('bgGlow').style.opacity = '0';
    document.getElementById('lightOrbs').style.opacity = '0';
    document.body.style.background = '#0D0D0D';
    document.getElementById('eventPhoto').style.boxShadow = 'none';
    if (window.StorytraceFX) StorytraceFX.off();
  }
  function showMessage(msg) {
    const el = document.getElementById('sceneMessage');
    el.classList.remove('show');
    setTimeout(() => { el.textContent = msg; el.classList.add('show'); }, 100);
  }
  function showWinner() {
    document.getElementById('winnerOverlay').style.display = 'flex';
    if (window.StorytraceFX) StorytraceFX.onWin();
    if (navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
    setTimeout(() => { document.getElementById('winnerOverlay').style.display = 'none'; }, 6000);
  }

  // ── 逐字歌詞顯示 ──
  let lyricsTimers = [];

  function hideLyrics() {
    lyricsTimers.forEach(t => clearTimeout(t));
    lyricsTimers = [];
    document.getElementById('lyricsDisplay').classList.remove('show');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // 照 text 排版：words 只有「字」沒有空格逗號（英文／韓文句會黏成一串），
  // 所以沿著 text 走，遇到下一個 word 就包成可點亮的 span，中間的空格標點原樣保留。
  // 空格切成一個個 run：英文／韓文的 run 整個不斷行（不會在音節中間折行），含中文字的 run 可逐字斷。
  function buildLyricHtml(text, words) {
    const tokens = [];   // { kind:'word', i, text } | { kind:'gap', text }
    let cursor = 0;
    let ok = true;
    words.forEach((w, i) => {
      const word = String(w.word == null ? '' : w.word);
      const at = word ? text.indexOf(word, cursor) : -1;
      if (at < 0) { ok = false; return; }
      if (at > cursor) tokens.push({ kind: 'gap', text: text.slice(cursor, at) });
      tokens.push({ kind: 'word', i: i, text: word });
      cursor = at + word.length;
    });
    if (!ok) {
      // text 跟 words 對不上：退回只排 words，多字詞之間補空格
      tokens.length = 0;
      words.forEach((w, i) => {
        const word = String(w.word == null ? '' : w.word);
        if (i > 0 && (word.length > 1 || String(words[i - 1].word || '').length > 1)) tokens.push({ kind: 'gap', text: ' ' });
        tokens.push({ kind: 'word', i: i, text: word });
      });
    } else if (cursor < text.length) {
      tokens.push({ kind: 'gap', text: text.slice(cursor) });
    }

    // 依空白切 run
    const runs = [];        // 每個 run 是 { html:[], text:'' }
    const out = [];
    let run = null;
    const flush = () => {
      if (!run || !run.html.length) { run = null; return; }
      const hasCJK = /[\u3400-\u9fff\uf900-\ufaff\u3040-\u30ff]/.test(run.text);
      out.push('<span class="lyric-run' + (hasCJK ? '' : ' nowrap') + '">' + run.html.join('') + '</span>');
      run = null;
    };
    const pushGapText = (t) => {
      if (!t) return;
      if (!run) run = { html: [], text: '' };
      run.html.push('<span class="lyric-gap">' + escapeHtml(t) + '</span>');
      run.text += t;
    };
    tokens.forEach(tok => {
      if (tok.kind === 'word') {
        if (!run) run = { html: [], text: '' };
        run.html.push('<span class="lyric-word" id="lw_' + tok.i + '">' + escapeHtml(tok.text) + '</span>');
        run.text += tok.text;
        return;
      }
      // gap：空白前的標點黏在前一個 run，空白本身變成 run 之間的間距，空白後的黏到下一個 run
      const m = /^(\S*)(\s+)(.*)$/s.exec(tok.text);
      if (!m) { pushGapText(tok.text); return; }
      pushGapText(m[1]);
      flush();
      out.push('<span class="lyric-space' + (/[\u3000]/.test(m[2]) ? ' wide' : '') + '"></span>');
      pushGapText(m[3]);
    });
    flush();
    return out.join('');
  }

  function showLyrics(cmd) {
    // 清掉上一句的 timer
    lyricsTimers.forEach(t => clearTimeout(t));
    lyricsTimers = [];

    const display = document.getElementById('lyricsDisplay');
    const line = document.getElementById('lyricLine');
    const words = Array.isArray(cmd.words) ? cmd.words : [];

    if (words.length === 0) {
      display.classList.remove('show');
      return;
    }

    line.style.setProperty('--lit', cmd.highlightColor || '#ffffff');
    const text = String(cmd.text || '');
    const visibleLen = text.replace(/\s/g, '').length;
    line.classList.toggle('long', visibleLen > 14 && visibleLen <= 22);
    line.classList.toggle('xlong', visibleLen > 22);
    line.innerHTML = buildLyricHtml(text, words);
    display.classList.add('show');
    if (window.StorytraceFX) StorytraceFX.onLyric();

    // 逐字點亮
    words.forEach((w, i) => {
      const delay = Math.max(0, (Number(w.offsetSec) || 0) * 1000);
      const tid = setTimeout(() => {
        const el = document.getElementById(`lw_${i}`);
        if (el) el.classList.add('lit');
      }, delay);
      lyricsTimers.push(tid);
    });

    // 整句結束後淡出（下一句進來會先清掉這個 timer）
    const lineDuration = (Number(words[words.length - 1].offsetSec) || 0) + 1.5;
    const fadeTimer = setTimeout(() => {
      display.classList.remove('show');
    }, lineDuration * 1000);
    lyricsTimers.push(fadeTimer);
  }

  document.getElementById('nameInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') window.joinEvent();
  });
</script>
