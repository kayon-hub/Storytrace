<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚禮 | Storytrace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 1.5s ease;
  }
  .bg-glow {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease, background 1s ease;
    z-index: 0;
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
  }
  #joinScreen { display: flex; flex-direction: column; align-items: center; }
  .logo { font-size: 48px; margin-bottom: 24px; }
  .join-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .join-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 40px; line-height: 1.6; }
  .name-input {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    color: white;
    font-size: 16px;
    text-align: center;
    margin-bottom: 16px;
    outline: none;
  }
  .name-input::placeholder { color: rgba(255,255,255,0.3); }
  .join-btn {
    width: 100%;
    padding: 16px;
    background: white;
    color: black;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .join-btn:active { transform: scale(0.97); }
  #mainScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .wedding-photo {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 3px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
    margin-bottom: 28px;
    transition: box-shadow 1s ease;
    overflow: hidden;
  }
  .couple-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 6px;
    transition: color 1s ease;
  }
  .wedding-date {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .scene-message {
    font-size: 22px;
    font-weight: 700;
    min-height: 32px;
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  .scene-message.show { opacity: 1; transform: translateY(0); }
  .light-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.08); }
  }
  .winner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .winner-emoji { font-size: 80px; margin-bottom: 24px; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
  .winner-text { font-size: 32px; font-weight: 800; color: #FFD700; margin-bottom: 12px; }
  .winner-sub { font-size: 16px; color: rgba(255,255,255,0.6); }
  .my-id { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 40px; letter-spacing: 1px; }
  .brand { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.15); text-transform: uppercase; margin-top: 8px; }
</style>
</head>
<body>

<div class="bg-glow" id="bgGlow"></div>
<div class="light-orbs" id="lightOrbs"></div>

<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-emoji">🎉</div>
  <div class="winner-text">恭喜你中獎！</div>
  <div class="winner-sub">請向工作人員領取禮品</div>
</div>

<div class="content">
  <div id="joinScreen">
    <div class="logo">💍</div>
    <div class="join-title">歡迎來到婚禮</div>
    <div class="join-sub">輸入你的名字<br>加入今天的幸福時刻</div>
    <input class="name-input" id="nameInput" placeholder="你的名字" maxlength="10">
    <button class="join-btn" onclick="joinWedding()">加入婚禮 ✨</button>
  </div>

  <div id="mainScreen">
    <div class="wedding-photo" id="weddingPhoto">💍</div>
    <div class="couple-name" id="coupleName">新郎 ♥ 新娘</div>
    <div class="wedding-date" id="weddingDate">2026 · KAYON STUDIO</div>
    <div class="scene-message" id="sceneMessage"></div>
    <div class="my-id" id="myId"></div>
    <div class="brand">Storytrace × KAYON STUDIO</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, onDisconnect, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAiYEuJtBppTJWrl90OBS7_vcCtrSI3jk",
    authDomain: "storytrace-wedding.firebaseapp.com",
    databaseURL: "https://storytrace-wedding-default-rtdb.firebaseio.com",
    projectId: "storytrace-wedding",
    storageBucket: "storytrace-wedding.firebasestorage.app",
    messagingSenderId: "865058497448",
    appId: "1:865058497448:web:f604e62c4c7407f464b39d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let myKey = null;

  window.joinWedding = function() {
    const name = document.getElementById('nameInput').value.trim() || '賓客';
    const guestRef = push(ref(db, 'guests'));
    myKey = guestRef.key;
    set(guestRef, { name, joinedAt: Date.now() });
    onDisconnect(guestRef).remove();
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    document.getElementById('myId').innerText = `我的序號：#${myKey.slice(-4).toUpperCase()}`;
    listenControl();
  };

  function listenControl() {
    onValue(ref(db, 'control'), (snap) => {
      const data = snap.val();
      if (!data) return;
      if (data.type === 'scene' || data.type === 'color') {
        applyColor(data.color, data.bg, data.message);
      } else if (data.type === 'lottery') {
        if (data.winner === myKey) {
          showWinner();
        } else {
          document.getElementById('winnerOverlay').style.display = 'none';
        }
      } else if (data.type === 'idle') {
        document.getElementById('winnerOverlay').style.display = 'none';
        resetColors();
      }
    });
  }

  function applyColor(color, bg, message) {
    const glow = document.getElementById('bgGlow');
    glow.style.background = bg || color;
    glow.style.opacity = '0.7';

    const orbs = document.getElementById('lightOrbs');
    orbs.style.opacity = '1';
    orbs.innerHTML = `
      <div class="orb" style="width:280px;height:280px;background:${color};opacity:0.6;top:5%;left:5%;animation-delay:0s;"></div>
      <div class="orb" style="width:220px;height:220px;background:${color};opacity:0.5;top:50%;right:5%;animation-delay:1s;"></div>
      <div class="orb" style="width:180px;height:180px;background:${color};opacity:0.55;bottom:10%;left:25%;animation-delay:2s;"></div>
    `;

    const msg = document.getElementById('sceneMessage');
    msg.classList.remove('show');
    setTimeout(() => {
      msg.innerText = message || '';
      if (message) msg.classList.add('show');
    }, 300);

    document.querySelector('.wedding-photo').style.boxShadow = `0 0 60px ${color}`;
  }

  function resetColors() {
    document.getElementById('bgGlow').style.opacity = '0';
    document.getElementById('lightOrbs').style.opacity = '0';
    document.getElementById('sceneMessage').classList.remove('show');
    document.querySelector('.wedding-photo').style.boxShadow = 'none';
  }

  function showWinner() {
    const overlay = document.getElementById('winnerOverlay');
    overlay.style.display = 'flex';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  }
</script>
</body>
</html>
