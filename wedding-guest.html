<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚禮 | Storytrace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 1.2s ease;
  }
  #bgGlow {
    position: fixed; inset: 0; opacity: 0;
    transition: opacity 1.2s ease, background-color 1.2s ease;
    z-index: 0;
    filter: saturate(2) brightness(1.2);
  }
  #lightOrbs {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1; opacity: 0;
    transition: opacity 1.2s ease;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(28px);
    animation: float 4s ease-in-out infinite;
    opacity: 0.95;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.08); }
  }
  .content { position: relative; z-index: 2; text-align: center; padding: 40px 32px; width: 100%; max-width: 380px; }
  #joinScreen { display: flex; flex-direction: column; align-items: center; }
  .logo { font-size: 48px; margin-bottom: 24px; }
  .join-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .join-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 40px; line-height: 1.6; }
  .name-input {
    width: 100%; padding: 16px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; color: white; font-size: 16px;
    text-align: center; margin-bottom: 16px; outline: none; -webkit-appearance: none;
  }
  .name-input::placeholder { color: rgba(255,255,255,0.3); }
  .join-btn {
    width: 100%; padding: 16px; background: white; color: black;
    border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px;
  }
  .join-btn:active { transform: scale(0.97); }
  #mainScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .wedding-photo {
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; margin-bottom: 28px; transition: box-shadow 1s; overflow: hidden;
  }
  .couple-name { font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 6px; }
  .wedding-date { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-bottom: 40px; }
  .scene-message {
    font-size: 22px; font-weight: 700; min-height: 32px; margin-bottom: 32px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
    text-shadow: 0 0 20px rgba(255,255,255,0.6);
  }
  .scene-message.show { opacity: 1; transform: translateY(0); }
  #myId { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 40px; letter-spacing: 1px; }
  .brand { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.15); text-transform: uppercase; margin-top: 8px; }
  .winner-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200;
    display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .winner-emoji { font-size: 80px; margin-bottom: 24px; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
  .winner-text { font-size: 32px; font-weight: 800; color: gold; margin-bottom: 12px; }
  .winner-sub { font-size: 16px; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div id="bgGlow"></div>
<div id="lightOrbs"></div>
<div id="winnerOverlay" class="winner-overlay">
  <div class="winner-emoji">🎉</div>
  <div class="winner-text">恭喜你！</div>
  <div class="winner-sub">你被選中了！</div>
</div>
<div class="content">
  <div id="joinScreen">
    <div class="logo">💍</div>
    <div class="join-title">加入婚禮燈海</div>
    <div class="join-sub">輸入你的名字<br>一起點亮這個美好的夜晚</div>
    <input type="text" id="nameInput" class="name-input" placeholder="你的名字" maxlength="20">
    <button class="join-btn" onclick="joinWedding()">加入 ✨</button>
  </div>
  <div id="mainScreen">
    <div id="weddingPhoto" class="wedding-photo">💑</div>
    <div id="coupleName" class="couple-name">新郎 & 新娘</div>
    <div id="weddingDate" class="wedding-date">FOREVER BEGINS TODAY</div>
    <div id="sceneMessage" class="scene-message"></div>
    <div id="myId"></div>
    <div class="brand">STORYTRACE · KAYON STUDIO</div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDAiYEuJtBppTJWrl90OBS7_vcCtrSI3jk",
    authDomain: "storytrace-wedding.firebaseapp.com",
    databaseURL: "https://storytrace-wedding-default-rtdb.firebaseio.com",
    projectId: "storytrace-wedding",
    storageBucket: "storytrace-wedding.firebasestorage.app",
    messagingSenderId: "865058497448",
    appId: "1:865058497448:web:f604e62c4c7407f464b39d"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let guestRef = null;
  function createOrbs() {
    const container = document.getElementById('lightOrbs');
    container.innerHTML = '';
    [{x:0,y:0,s:280},{x:55,y:0,s:260},{x:0,y:50,s:300},{x:55,y:50,s:280},{x:25,y:25,s:340}]
      .forEach((pos, i) => {
        const orb = document.createElement('div');
        orb.className = 'orb';
        orb.style.cssText = `left:${pos.x}%;top:${pos.y}%;width:${pos.s}px;height:${pos.s}px;background:white;animation-delay:${i*0.7}s;animation-duration:${3.5+i*0.4}s;`;
        container.appendChild(orb);
      });
  }
  createOrbs();
  window.joinWedding = function() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { document.getElementById('nameInput').focus(); return; }
    guestRef = push(ref(db, 'guests'));
    set(guestRef, { name, joinedAt: Date.now() });
    window.addEventListener('beforeunload', () => { if (guestRef) set(guestRef, null); });
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    document.getElementById('myId').textContent = `ID: ${guestRef.key.slice(-8)}`;
    listenToControl();
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
  };
  function listenToControl() {
    onValue(ref(db, 'control'), (snap) => {
      const cmd = snap.val();
      if (!cmd) return;
      if (cmd.type === 'color') setLight(cmd.color, cmd.message || '');
      else if (cmd.type === 'off') lightsOff();
      else if (cmd.type === 'lottery' && guestRef && cmd.winner === guestRef.key) showWinner();
    });
  }
  function setLight(color, message) {
    const bgGlow = document.getElementById('bgGlow');
    const lightOrbs = document.getElementById('lightOrbs');
    document.body.style.background = color;
    bgGlow.style.backgroundColor = color;
    bgGlow.style.opacity = '1';
    document.querySelectorAll('.orb').forEach(o => o.style.background = color);
    lightOrbs.style.opacity = '1';
    document.getElementById('weddingPhoto').style.boxShadow = `0 0 80px ${color}, 0 0 160px ${color}`;
    if (message) showMessage(message);
  }
  function lightsOff() {
    document.getElementById('bgGlow').style.opacity = '0';
    document.getElementById('lightOrbs').style.opacity = '0';
    document.body.style.background = '#000';
    document.getElementById('weddingPhoto').style.boxShadow = 'none';
  }
  function showMessage(msg) {
    const el = document.getElementById('sceneMessage');
    el.classList.remove('show');
    setTimeout(() => { el.textContent = msg; el.classList.add('show'); }, 100);
  }
  function showWinner() {
    const overlay = document.getElementById('winnerOverlay');
    overlay.style.display = 'flex';
    if (navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
    setTimeout(() => { overlay.style.display = 'none'; }, 6000);
  }
  document.getElementById('nameInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') window.joinWedding();
  });
</script>
</body>
</html>
