<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storytrace | KAYON STUDIO</title>

<style>
  :root {
    --accent: #00E5FF;
    --glass: rgba(255, 255, 255, 0.08);
  }

  body {
    margin: 0;
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, system-ui, sans-serif;
    color: white;
    overflow: hidden;
  }

  /* 磨砂玻璃容器 */
  .player {
    width: 85%;
    max-width: 360px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 40px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }

  .cover-box {
    width: 100%;
    aspect-ratio: 1/1;
    margin-bottom: 25px;
  }

  .cover {
    width: 100%;
    height: 100%;
    border-radius: 25px;
    object-fit: cover;
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.2);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* 播放時封面動態 */
  .playing .cover {
    transform: scale(1.05);
  }

  .title { font-size: 20px; font-weight: 700; margin: 0; }
  .artist { color: #888; font-size: 14px; margin: 8px 0 20px; }

  /* 進度條系統 */
  .progress-area { width: 100%; cursor: pointer; margin-bottom: 5px; }
  .bar-bg {
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
  }
  .bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #00E5FF, #0066FF);
    border-radius: 10px;
  }
  .time-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #666; margin-top: 8px;
  }

  /* 控制鍵 */
  .controls {
    display: flex; justify-content: space-around; align-items: center;
    margin-top: 20px;
  }

  button {
    background: none; border: none; color: white;
    cursor: pointer; transition: 0.2s; font-size: 24px;
  }

  .play-btn {
    width: 65px; height: 65px;
    background: white; color: black;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  /* 歌詞面板 (滑出式) */
  .lyrics-panel {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 100; display: none;
    flex-direction: column; padding: 60px 40px;
    box-sizing: border-box; overflow-y: auto;
  }

  .lyrics-text {
    font-size: 22px; line-height: 1.8; font-weight: 600;
    color: #fff; text-align: left;
  }

  .close-lyrics { position: absolute; top: 30px; right: 30px; font-size: 30px; color: #888; }

</style>
</head>
<body>

<div class="player" id="mainPlayer">
  <div class="cover-box">
    <img id="coverImg" class="cover" src="">
  </div>

  <div class="info">
    <p id="trackTitle" class="title"></p>
    <p id="trackArtist" class="artist"></p>
  </div>

  <div class="progress-area" onclick="seek(event)">
    <div class="bar-bg">
      <div id="barFill" class="bar-fill"></div>
    </div>
    <div class="time-labels">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button onclick="openLyrics()">☰</button>
    <button onclick="restart()">⏮</button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="share()">⤴</button>
  </div>
</div>

<div id="lyricsPanel" class="lyrics-panel">
  <button class="close-lyrics" onclick="closeLyrics()">✕</button>
  <div id="lyricsContent" class="lyrics-text"></div>
</div>

<audio id="audioMain"></audio>

<script>
  const audio = document.getElementById("audioMain");
  const playBtn = document.getElementById("playBtn");
  const barFill = document.getElementById("barFill");
  const player = document.getElementById("mainPlayer");

  // 1. 客戶資料管理區 (ID 務必唯一)
  const projects = {
    "yaochi": {
      title: "瑤池之光",
      artist: "KAYON × 瑤池金母",
      cover: "data/yaochicover.png",
      music: "data/yaochi.mp3",
      lyrics: "在瑤池的光芒下<br>尋找失落的願望<br>萬物皆有靈<br>你是最美的那道光"
    },
    "wedding_demo": {
      title: "愛的回憶錄",
      artist: "小明 & 小美",
      cover: "data/wedding_cover.jpg",
      music: "data/wedding_song.mp3",
      lyrics: "這是一段專屬於我們的旋律<br>謝謝你在這一天<br>見證我們的幸福"
    }
    // 下一個客戶加在下面...
  };

  // 2. 初始化載入
  window.onload = () => {
    const id = new URLSearchParams(window.location.search).get("id") || "yaochi";
    const data = projects[id] || projects["yaochi"];

    document.getElementById("trackTitle").innerText = data.title;
    document.getElementById("trackArtist").innerText = data.artist;
    document.getElementById("coverImg").src = data.cover;
    document.getElementById("lyricsContent").innerHTML = data.lyrics;
    audio.src = data.music;
  };

  // 3. 播放器邏輯
  function togglePlay() {
    if (audio.paused) {
      audio.play();
      playBtn.innerText = "⏸";
      player.classList.add("playing");
    } else {
      audio.pause();
      playBtn.innerText = "▶";
      player.classList.remove("playing");
    }
  }

  audio.ontimeupdate = () => {
    const percent = (audio.currentTime / audio.duration) * 100;
    barFill.style.width = percent + "%";
    document.getElementById("currentTime").innerText = formatTime(audio.currentTime);
    if(audio.duration) {
      document.getElementById("durationTime").innerText = formatTime(audio.duration);
    }
  };

  function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function seek(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
  }

  function restart() { audio.currentTime = 0; }

  // 4. 歌詞功能
  function openLyrics() { document.getElementById("lyricsPanel").style.display = "flex"; }
  function closeLyrics() { document.getElementById("lyricsPanel").style.display = "none"; }

  // 5. 原生分享 (支援 iOS/Android)
  async function share() {
    try {
      if (navigator.share) {
        await navigator.share({
          title: document.getElementById("trackTitle").innerText,
          url: window.location.href
        });
      } else {
        alert("網址已複製！");
        navigator.clipboard.writeText(window.location.href);
      }
    } catch (err) {}
  }
</script>

</body>
</html>
