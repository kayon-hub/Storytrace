<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storytrace</title>
<meta name="description" content="手機，成為現場的光。Every cue tells a story.">
<meta property="og:title" content="Storytrace">
<meta property="og:description" content="手機，成為現場的光。Every cue tells a story.">
<meta property="og:image" content="https://storytrace.karbonxgaiaentertainment.com/hero-wide.jpg">
<meta property="og:url" content="https://storytrace.karbonxgaiaentertainment.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="storytrace-mark.jpg">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('id')) location.replace('listen.html' + location.search + location.hash);
  })();
</script>
<script src="storytrace-fx.js"></script>
<style>
  :root {
    --black: #0D0D0D;
    --surface: #141414;
    --gold: #C9A84C;
    --gold-lt: #E8C97A;
    --cream: #F0EBE0;
    --muted: rgba(240,235,224,0.45);
    --line: rgba(201,168,76,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--black); color: var(--cream); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    min-height: 100svh;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
    cursor: pointer;
    overflow: hidden;
  }
  .hero-photo {
    position: absolute; inset: 0; z-index: 0;
    background: #0D0D0D url(hero-aisle.jpg) center 42% / cover no-repeat;
    transform: scale(1.06);
    animation: ken 24s ease-in-out infinite alternate;
  }
  @keyframes ken {
    from { transform: scale(1.06) translate3d(0,0,0); }
    to { transform: scale(1.14) translate3d(0,-1.6%,0); }
  }
  .hero-copy { position: relative; z-index: 50; margin-top: auto; }
  .hero::after {
    content: '';
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(13,13,13,0.18) 0%, rgba(13,13,13,0.04) 32%, rgba(13,13,13,0.22) 62%, rgba(13,13,13,0.78) 100%);
  }
  .mark-wrap {
    position: relative;
    width: 72px; height: 72px;
    margin-bottom: 14px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
  }
  .mark-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mark-wrap::after {
    content: '';
    position: absolute; inset: -60% -20%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.22) 50%, transparent 58%);
    animation: sheen 5.8s ease-in-out infinite;
  }
  @keyframes sheen {
    0% { transform: translateX(-40%) rotate(18deg); }
    100% { transform: translateX(40%) rotate(18deg); }
  }
  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px; font-style: italic; font-weight: 400;
    color: #fff; letter-spacing: 0.01em; line-height: 1;
    text-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  .rule { width: 36px; height: 1px; background: var(--gold); margin: 14px auto 12px; }
  .tag {
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold-lt); margin-bottom: 14px;
  }
  .line {
    font-size: 16px; color: var(--cream); letter-spacing: 0.08em; line-height: 1.7;
  }
  .hint {
    position: absolute;
    z-index: 50;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    font-size: 10px; letter-spacing: 0.22em; color: var(--muted);
    text-transform: uppercase;
    animation: hintFade 2.4s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  .rise { opacity: 1; }

  section { position: relative; z-index: 2; padding: 8px 22px 8px; }
  .kicker {
    font-size: 11px; letter-spacing: 0.28em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  h2 {
    font-family: "Songti TC", "Songti SC", Georgia, serif;
    font-weight: 400; font-size: 26px; color: #fff; margin-bottom: 22px;
  }
  .beats { display: grid; gap: 10px; }
  .beat {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 16px 16px;
  }
  .beat .n {
    font-family: Georgia, serif; font-size: 12px; color: var(--gold);
    letter-spacing: 0.16em; margin-bottom: 8px;
  }
  .beat h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.06em; }
  .beat p { font-size: 13px; color: var(--muted); line-height: 1.7; }

  .works { display: grid; gap: 12px; padding-bottom: 12px; }
  .work { background: var(--surface); border: 1px solid var(--line); }
  .work img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }

  .moment {
    position: relative;
    height: 78vh; min-height: 420px;
    margin: 28px 0 8px;
    overflow: hidden;
  }
  .moment img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 42%;
    display: block; transform: scale(1.04);
  }
  .moment .cap {
    position: absolute; left: 22px; right: 22px; bottom: 22px;
    font-family: "Songti TC", Georgia, serif; font-size: 20px; color: #fff;
    text-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }

  footer {
    padding: 36px 22px calc(40px + env(safe-area-inset-bottom));
    text-align: center;
  }
  footer .brands {
    font-size: 9px; letter-spacing: 0.16em; color: var(--muted);
    text-transform: uppercase; line-height: 1.8;
  }
  footer a { color: var(--gold); text-decoration: none; font-size: 12px; letter-spacing: 0.08em; }

  @media (min-width: 720px) {
    .wordmark { font-size: 48px; }
    .mark-wrap { width: 88px; height: 88px; border-radius: 20px; }
    .hero-photo { background-image: url(hero-wide.jpg); background-position: center 46%; }
    .beats, .works { grid-template-columns: 1fr 1fr 1fr; max-width: 980px; margin: 0 auto; }
    section { padding-left: 40px; padding-right: 40px; }
    .moment { height: 88vh; }
    .moment .cap { left: 40px; bottom: 36px; font-size: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise, .mark-wrap::after, .hint, .hero-photo { animation: none; }
    .hero-photo { transform: none; }
    .rise { opacity: 1; }
  }
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="Storytrace">
  <div class="hero-photo" aria-hidden="true"></div>
  <div class="hero-copy">
    <div class="wordmark">Storytrace</div>
    <div class="rule"></div>
    <div class="tag">Every cue tells a story</div>
    <div class="line">手機，成為現場的光。</div>
  </div>
  <div class="hint">點畫面再看一輪光</div>
</section>

<figure class="moment">
  <img src="hero-bliss.jpg" alt="新人背影，靠在一起看著現場">
  <figcaption class="cap">夜晚的派對，剛剛好。</figcaption>
</figure>

<section>
  <div class="kicker">Live</div>
  <h2>現場三件事</h2>
  <div class="beats">
    <article class="beat">
      <div class="n">01</div>
      <h3>燈光</h3>
      <p>全場手機跟著音樂換色，成為舞台的一部分。</p>
    </article>
    <article class="beat">
      <div class="n">02</div>
      <h3>歌詞</h3>
      <p>逐字點亮，跟現場同一拍。</p>
    </article>
    <article class="beat">
      <div class="n">03</div>
      <h3>入場</h3>
      <p>桌上小物一碰，手機自己進來。網頁就能用。</p>
    </article>
  </div>
</section>

<section style="padding-top: 48px;">
  <div class="kicker">Works</div>
  <h2>作品</h2>
  <div class="works">
    <figure class="work"><img src="shanghao.jpg" alt="上好的代誌"></figure>
    <figure class="work"><img src="naxernew.jpg" alt="Candy &amp; Sugar"></figure>
    <figure class="work"><img src="insync.jpg" alt="合拍 In Sync"></figure>
  </div>
</section>

<footer>
  <p><a href="privacy.html">隱私權政策</a></p>
  <p class="brands" style="margin-top: 18px;">Storytrace<br>OBARAI · KAYON STUDIO · KARBØN X GAIA ENTERTAINMENT</p>
</footer>

<script>
  function playEntrance() {
    if (window.StorytraceFX && window.StorytraceFX.romance) StorytraceFX.romance();
  }
  if (window.StorytraceFX) {
    StorytraceFX.ambient();
    setTimeout(playEntrance, 1400);
    setInterval(playEntrance, 11000);
  }
  document.getElementById('hero').addEventListener('click', playEntrance);
</script>
</body>
</html>
