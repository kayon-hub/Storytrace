<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storytrace | KAYON STUDIO</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
  :root {
    --accent: #00E5FF;
    --glass: rgba(255, 255, 255, 0.1);
  }

  body {
    margin: 0;
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white;
    overflow: hidden;
  }

  /* 播放器容器 */
  .player {
    width: 88%;
    max-width: 380px;
    background: var(--glass);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 40px;
    padding: 35px 30px;
    text-align: center;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
  }

  .cover-box {
    width: 100%;
    aspect-ratio: 1/1;
    margin-bottom: 25px;
  }

  .cover {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 15px 45px rgba(0, 229, 255, 0.2);
    transition: transform 0.5s ease;
  }

  .playing .cover {
    transform: scale(1.05);
    box-shadow: 0 20px 60px rgba(0, 229, 255, 0.4);
  }

  .info { margin-bottom: 25px; }
  .title { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: 1px; }
  .artist { color: #aaa; font-size: 14px; margin-top: 10px; line-height: 1.6; white-space: pre-wrap; }

  /* 進度條系統 */
  .progress-area { width: 100%; cursor: pointer; margin-top: 20px; }
  .bar-bg {
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #00E5FF, #0066FF);
    border-radius: 10px;
  }
  .time-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #666; margin-top: 8px;
  }

  /* 控制鍵區 */
  .controls {
    display: flex; justify-content: space-around; align-items: center;
    margin-top: 25px;
  }

  button {
    background: none; border: none; color: white;
    cursor: pointer; transition: 0.2s; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
  }

  .play-btn {
    width: 70px; height: 70px;
    background: white; color: black;
    border-radius: 50%;
    font-size: 32px;
    box-shadow: 0 10px 25px rgba(255,255,255,0.15);
  }

  button:active { transform: scale(0.9); }

  /* 歌詞面板 */
  .lyrics-panel {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.96);
    z-index: 100; display: none;
    flex-direction: column; padding: 80px 40px;
    box-sizing: border-box; overflow-y: auto;
    text-align: left;
  }

  .lyrics-text {
    font-size: 24px; line-height: 1.8; font-weight: 600;
    background: linear-gradient(180deg, #fff 0%, #666 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .close-lyrics { position: absolute; top: 35px; right: 30px; font-size: 35px; color: #666; }
</style>
</head>
<body>

<div class="player" id="mainPlayer">
  <div class="cover-box">
    <img id="coverImg" class="cover" src="">
  </div>

  <div class="info">
    <p id="trackTitle" class="title"></p>
    <p id="trackArtist" class="artist"></p>
  </div>

  <div class="progress-area" onclick="seek(event)">
    <div class="bar-bg">
      <div id="barFill" class="bar-fill"></div>
    </div>
    <div class="time-labels">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button onclick="openLyrics()">☰</button>
    <button onclick="restart()">⏮</button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="share()">⤴</button>
  </div>
</div>

<div id="lyricsPanel" class="lyrics-panel">
  <button class="close-lyrics" onclick="closeLyrics()">✕</button>
  <div id="lyricsContent" class="lyrics-text"></div>
</div>

<audio id="audioMain" preload="metadata"></audio>

<script>
  const audio = document.getElementById("audioMain");
  const playBtn = document.getElementById("playBtn");
  const barFill = document.getElementById("barFill");
  const player = document.getElementById("mainPlayer");

  // 【資料庫更新】路徑已根據截圖修正為同級目錄
  const projects = {
    "yaochi": {
      title: "瑤池之光",
      artist: "曾子修/慧全、梁弘珉/慈泰\n黃芝亭/慧彤、田虹軒/妙毓",
      cover: "yaochicover.png",
      music: "yaochiv.MP3", 
      lyrics: "在瑤池的光芒下<br>尋找失落的願望<br>萬物皆有靈<br>你是最美的那道光"
    }
  };

  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "yaochi";
    const data = projects[id] || projects["yaochi"];

    document.getElementById("trackTitle").innerText = data.title;
    document.getElementById("trackArtist").innerText = data.artist;
    document.getElementById("coverImg").src = data.cover;
    document.getElementById("lyricsContent").innerHTML = data.lyrics;
    audio.src = data.music;
  };

  function togglePlay() {
    if (audio.paused) {
      audio.play().catch(err => {
        alert("請先點擊頁面任意處後再點播放！");
      });
      playBtn.innerText = "⏸";
      player.classList.add("playing");
    } else {
      audio.pause();
      playBtn.innerText = "▶";
      player.classList.remove("playing");
    }
  }

  audio.ontimeupdate = () => {
    if (audio.duration) {
      const percent = (audio.currentTime / audio.duration) * 100;
      barFill.style.width = percent + "%";
      document.getElementById("currentTime").innerText = formatTime(audio.currentTime);
      document.getElementById("durationTime").innerText = formatTime(audio.duration);
    }
  };

  function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function seek(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
  }

  function restart() { audio.currentTime = 0; }
  function openLyrics() { document.getElementById("lyricsPanel").style.display = "flex"; }
  function closeLyrics() { document.getElementById("lyricsPanel").style.display = "none"; }

  async function share() {
    try {
      if (navigator.share) {
        await navigator.share({
          title: "瑤池之光 - Storytrace",
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("網址已複製");
      }
    } catch (err) {}
  }
</script>

</body>
</html>
