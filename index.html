<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora Player</title>

<style>
body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: sans-serif;
}

.player {
  width: 90%;
  max-width: 380px;
  background: #000;
  border-radius: 30px;
  padding: 20px;
}

.cover {
  width: 100%;
  border-radius: 18px;
  box-shadow: 0 0 20px rgba(0,229,255,0.4);
}

.info {
  text-align: center;
  margin-top: 12px;
}

.title {
  color: white;
  font-size: 16px;
  font-weight: 600;
}

.artist {
  color: #888;
  font-size: 13px;
  margin-top: 4px;
}

.top-controls {
  display: flex;
  justify-content: space-between;
  margin: 15px 0;
  color: white;
  font-size: 22px;
}

.progress {
  width: 100%;
  height: 4px;
  background: #111;
  border-radius: 2px;
  margin: 15px 0;
  cursor: pointer;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#00E5FF,#0066FF);
}

.controls {
  display: flex;
  justify-content: space-around;
  align-items: center;
  color: white;
  font-size: 26px;
}

.play {
  font-size: 42px;
}

.lyrics {
  display: none;
  color: white;
  font-size: 14px;
  margin-top: 10px;
  opacity: 0.8;
}

/* 按鍵效果 */
button {
  background: none;
  border: none;
  color: white;
  transition: all 0.15s ease;
}

button:active {
  transform: scale(1.15);
  filter: brightness(1.5);
}

.play:active {
  transform: scale(1.25);
  box-shadow: 0 0 20px rgba(0,229,255,0.6);
}
</style>
</head>

<body>

<div class="player">

  <img class="cover" src="cover.png">

  <div class="info">
    <div class="title">Loading...</div>
    <div class="artist"></div>
  </div>

  <div class="top-controls">
    <div>
      <button onclick="toggleLyrics()">☰</button>
      <button onclick="share()">⤴</button>
    </div>
    <div>
      <button onclick="volumeUp()">🔊</button>
    </div>
  </div>

  <div class="progress" onclick="seek(event)">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="controls">
    <button>🔁</button>
    <button onclick="restart()">⏮</button>
    <button class="play" onclick="togglePlay()">▶</button>
    <button onclick="end()">⏭</button>
    <button>🔀</button>
  </div>

  <div class="lyrics" id="lyrics">
    音樂正在播放...
  </div>

</div>

<audio id="audio" preload="auto"></audio>

<script>
const audio = document.getElementById("audio");
const bar = document.getElementById("bar");
const lyrics = document.getElementById("lyrics");

/* 🔥 客戶資料 */
const data = {
  "yaochi": {
    title: "瑤池之光",
    artist: "KAYON × 瑤池金母",
    cover: "yaochicover.png",
    music: "yaochi.mp3"
  },
  "test": {
    title: "測試歌曲",
    artist: "KAYON",
    cover: "cover.png",
    music: "kayon.mp3"
  }
};

/* 🔥 讀取網址 id */
const id = new URLSearchParams(window.location.search).get("id") || "yaochi";
const current = data[id] || data["yaochi"];

/* 🔥 套資料 */
document.querySelector(".title").innerText = current.title;
document.querySelector(".artist").innerText = current.artist;
document.querySelector(".cover").src = current.cover;

audio.src = current.music;
audio.load();

/* 播放 */
function togglePlay() {
  if (audio.paused) {
    audio.currentTime = audio.currentTime || 0;
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

/* 進度 */
audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    bar.style.width = (audio.currentTime / audio.duration) * 100 + "%";
  }
});

/* 拖動 */
function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
}

function restart() {
  audio.currentTime = 0;
}

function end() {
  audio.currentTime = audio.duration;
}

function toggleLyrics() {
  lyrics.style.display =
    lyrics.style.display === "block" ? "none" : "block";
}

function volumeUp() {
  audio.volume = Math.min(audio.volume + 0.1, 1);
}

function share() {
  if (navigator.share) {
    navigator.share({
      title: current.title,
      text: 'Listen to this',
      url: window.location.href
    });
  }
}
</script>

</body>
</html>
