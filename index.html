<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora Player</title>

<style>
body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: sans-serif;
}

.player {
  width: 90%;
  max-width: 380px;
  padding: 20px;
}

.cover {
  width: 100%;
  border-radius: 18px;
}

.title {
  color: white;
  text-align: center;
  margin-top: 10px;
}

.artist {
  color: #888;
  text-align: center;
}

button {
  color: white;
  background: none;
  border: none;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="player">
  <img id="cover" class="cover" src="">
  <div id="title" class="title"></div>
  <div id="artist" class="artist"></div>

  <button onclick="togglePlay()">▶ 播放</button>
</div>

<audio id="audio"></audio>

<script>

/* 🔥 客戶資料（只放一筆也OK） */
const data = {
  yaochi: {
    title: "瑤池之光",
    artist: "KAYON × 瑤池金母",
    cover: "yaochicover.png",
    music: "yaochi.mp3"
  }
};

/* 🔥 先抓 DOM（避免錯） */
const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");

/* 🔥 讀網址 */
const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "yaochi";

/* 🔥 防呆 */
const current = data[id] ? data[id] : data["yaochi"];

/* 🔥 套資料 */
title.innerText = current.title;
artist.innerText = current.artist;
cover.src = current.cover;
audio.src = current.music;

/* 🔥 播放 */
function togglePlay() {
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

</script>

</body>
</html>
