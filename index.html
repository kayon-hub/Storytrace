<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storytrace</title>
<meta name="description" content="手機，成為現場的光。Every cue tells a story.">
<meta property="og:title" content="Storytrace">
<meta property="og:description" content="手機，成為現場的光。Every cue tells a story.">
<meta property="og:image" content="https://storytrace.karbonxgaiaentertainment.com/storytrace-mark.jpg">
<meta property="og:url" content="https://storytrace.karbonxgaiaentertainment.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="storytrace-mark.jpg">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('id')) location.replace('listen.html' + location.search + location.hash);
  })();
</script>
<script src="storytrace-fx.js"></script>
<style>
  :root {
    --black: #0D0D0D;
    --surface: #141414;
    --gold: #C9A84C;
    --gold-lt: #E8C97A;
    --cream: #F0EBE0;
    --muted: rgba(240,235,224,0.45);
    --line: rgba(201,168,76,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--black); color: var(--cream); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    min-height: 100svh;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(28px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));
    cursor: pointer;
  }
  .hero-copy { position: relative; z-index: 50; }
  .hero::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 42% at 50% 0%, rgba(201,168,76,0.16) 0%, transparent 58%),
      radial-gradient(ellipse 40% 28% at 50% 100%, rgba(201,168,76,0.08) 0%, transparent 55%);
  }
  .cue {
    position: absolute;
    left: 50%; top: 6%;
    width: 1px; height: 28%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, rgba(232,201,122,0.85), transparent);
    opacity: 0.55;
    animation: cuePulse 4.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cuePulse {
    0%, 100% { opacity: 0.18; transform: translateX(-50%) scaleY(0.92); }
    50% { opacity: 0.8; transform: translateX(-50%) scaleY(1); }
  }
  .mark-wrap {
    position: relative;
    width: 108px; height: 108px;
    margin-bottom: 22px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 40px rgba(201,168,76,0.12);
  }
  .mark-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mark-wrap::after {
    content: '';
    position: absolute; inset: -60% -20%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.22) 50%, transparent 58%);
    animation: sheen 5.8s ease-in-out infinite;
  }
  @keyframes sheen {
    0% { transform: translateX(-40%) rotate(18deg); }
    100% { transform: translateX(40%) rotate(18deg); }
  }
  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 42px; font-style: italic; font-weight: 400;
    color: #fff; letter-spacing: 0.01em; line-height: 1;
  }
  .rule { width: 36px; height: 1px; background: var(--gold); margin: 18px auto 16px; }
  .tag {
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold-lt); margin-bottom: 14px;
  }
  .line {
    font-size: 16px; color: var(--cream); letter-spacing: 0.08em; line-height: 1.7;
  }
  .hint {
    position: absolute;
    z-index: 50;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    font-size: 10px; letter-spacing: 0.22em; color: var(--muted);
    text-transform: uppercase;
    animation: hintFade 2.4s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  .rise { opacity: 0; transform: translateY(18px); animation: rise 0.9s ease forwards; }
  .d1 { animation-delay: 0.12s; }
  .d2 { animation-delay: 0.28s; }
  .d3 { animation-delay: 0.44s; }
  .d4 { animation-delay: 0.6s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  section { position: relative; z-index: 2; padding: 8px 22px 8px; }
  .kicker {
    font-size: 11px; letter-spacing: 0.28em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  h2 {
    font-family: "Songti TC", "Songti SC", Georgia, serif;
    font-weight: 400; font-size: 26px; color: #fff; margin-bottom: 22px;
  }
  .beats { display: grid; gap: 10px; }
  .beat {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 16px 16px;
  }
  .beat .n {
    font-family: Georgia, serif; font-size: 12px; color: var(--gold);
    letter-spacing: 0.16em; margin-bottom: 8px;
  }
  .beat h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.06em; }
  .beat p { font-size: 13px; color: var(--muted); line-height: 1.7; }

  .works { display: grid; gap: 12px; padding-bottom: 12px; }
  .work {
    display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    padding: 10px 12px; text-decoration: none; color: inherit;
  }
  .work img { width: 72px; height: 72px; object-fit: cover; display: block; }
  .work .t { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .work .s { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }

  footer {
    padding: 36px 22px calc(40px + env(safe-area-inset-bottom));
    text-align: center;
  }
  footer .brands {
    font-size: 9px; letter-spacing: 0.16em; color: var(--muted);
    text-transform: uppercase; line-height: 1.8;
  }
  footer a { color: var(--gold); text-decoration: none; font-size: 12px; letter-spacing: 0.08em; }

  @media (min-width: 720px) {
    .wordmark { font-size: 64px; }
    .mark-wrap { width: 132px; height: 132px; border-radius: 28px; }
    .beats, .works { grid-template-columns: 1fr 1fr 1fr; max-width: 980px; margin: 0 auto; }
    .work { grid-template-columns: 1fr; padding: 0 0 14px; }
    .work img { width: 100%; height: auto; aspect-ratio: 1; }
    section { padding-left: 40px; padding-right: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise, .mark-wrap::after, .cue, .hint { animation: none; }
    .rise { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="Storytrace">
  <div class="cue" aria-hidden="true"></div>
  <div class="hero-copy">
    <div class="mark-wrap rise d1">
      <img src="storytrace-mark.jpg" alt="STORYTRACE">
    </div>
    <div class="wordmark rise d2">Storytrace</div>
    <div class="rule rise d3"></div>
    <div class="tag rise d3">Every cue tells a story</div>
    <div class="line rise d4">手機，成為現場的光。</div>
  </div>
  <div class="hint">點畫面再看一輪光</div>
</section>

<section>
  <div class="kicker">Live</div>
  <h2>現場三件事</h2>
  <div class="beats">
    <article class="beat">
      <div class="n">01</div>
      <h3>燈光</h3>
      <p>全場手機跟著音樂換色，成為舞台的一部分。</p>
    </article>
    <article class="beat">
      <div class="n">02</div>
      <h3>歌詞</h3>
      <p>逐字點亮，跟現場同一拍。</p>
    </article>
    <article class="beat">
      <div class="n">03</div>
      <h3>入場</h3>
      <p>桌上小物一碰，手機自己進來。網頁就能用。</p>
    </article>
  </div>
</section>

<section style="padding-top: 48px;">
  <div class="kicker">Works</div>
  <h2>作品</h2>
  <div class="works">
    <a class="work" href="listen.html?id=shanghao">
      <img src="shanghao.jpg" alt="上好的代誌">
      <div>
        <div class="t">上好的代誌</div>
        <div class="s">Listen</div>
      </div>
    </a>
    <a class="work" href="listen.html?id=yaochi0011">
      <img src="yaochi0011cover.png" alt="瑤池之光">
      <div>
        <div class="t">瑤池之光</div>
        <div class="s">Listen</div>
      </div>
    </a>
    <a class="work" href="listen.html?id=oscar_insync">
      <img src="insync.jpg" alt="合拍 In Sync">
      <div>
        <div class="t">合拍 In Sync</div>
        <div class="s">Listen</div>
      </div>
    </a>
  </div>
</section>

<footer>
  <p><a href="privacy.html">隱私權政策</a></p>
  <p class="brands" style="margin-top: 18px;">Storytrace<br>OBARAI · KAYON STUDIO · KARBØN X GAIA ENTERTAINMENT</p>
</footer>

<script>
  function playEntrance() {
    if (!window.StorytraceFX) return;
    StorytraceFX.onColor('hsl(45,100%,50%)');
    setTimeout(function () { StorytraceFX.onLyric(); }, 1600);
  }
  if (window.StorytraceFX) {
    StorytraceFX.ambient();
    setTimeout(playEntrance, 700);
  }
  document.getElementById('hero').addEventListener('click', playEntrance);
</script>
</body>
</html>
